<html><head></head><body><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"apolloState":{"Contributor:kca://author/amzn1.gr.author.v1.etOXYfKALe64_8fQ9YUE2g":{"__typename":"Contributor","id":"kca://author/amzn1.gr.author.v1.etOXYfKALe64_8fQ9YUE2g","legacyId":8842,"name":"Susanna Clarke","description":"Susanna Clarke was born in Nottingham in 1959. A nomadic childhood was spent in towns in Northern England and Scotland. She was educated at St Hilda's College, Oxford, and has worked in various areas of non-fiction publishing, including Gordon Fraser and Quarto. In 1990, she left London and went to Turin to teach English to stressed-out executives of the Fiat motor company. The following year she taught English in Bilbao.<br /><br />She returned to England in 1992 and spent the rest of that year in County Durham, in a house that looked out over the North Sea. There she began working on her first novel, <a href=\"https://www.goodreads.com/search/search?q=%20Jonathan%20Strange%20&amp;%20Mr%20Norrell.\" title=\" Jonathan Strange &amp; Mr Norrell.\" rel=\"nofollow noopener\"> Jonathan Strange &amp; Mr Norrell.</a><br /><br />From 1993 to 2003, Susanna Clarke was an editor at Simon and Schuster's Cambridge office, where she worked on their cookery list. She has published seven short stories and novellas in US anthologies. One, \"The Duke of Wellington Misplaces His Horse,\" first appeared in a limited-edition, illustrated chapbook from Green Man Press. Another, \"Mr Simonelli or The Fairy Widower,\" was shortlisted for a World Fantasy Award in 2001.<br /><br />She lives in Cambridge with her partner, the novelist and reviewer Colin Greenland. ","isGrAuthor":false,"works":{"__typename":"ContributorWorksConnection","totalCount":33},"profileImageUrl":"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/authors/1453496946i/8842._UX200_CR0,6,200,200_.jpg","webUrl":"https://www.goodreads.com/author/show/8842.Susanna_Clarke","viewerIsFollowing":null,"followers":{"__typename":"ContributorFollowersConnection","totalCount":13631},"user":null},"Book:kca://book/amzn1.gr.book.v3.5dYsgrvLZPPvUFeL":{"__typename":"Book","id":"kca://book/amzn1.gr.book.v3.5dYsgrvLZPPvUFeL","legacyId":50202953,"webUrl":"https://www.goodreads.com/book/show/50202953-piranesi","viewerShelving":null,"title":"Piranesi","titleComplete":"Piranesi","description":"<i>Alternate cover edition of ISBN <a href=\"https://www.goodreads.com/book/show/255359083-piranesi\">9781635575637</a>.</i><br /><br />Piranesi’s house is no ordinary building: its rooms are infinite, its corridors endless, its walls are lined with thousands upon thousands of statues, each one different from all the others. Within the labyrinth of halls an ocean is imprisoned; waves thunder up staircases, rooms are flooded in an instant. But Piranesi is not afraid; he understands the tides as he understands the pattern of the labyrinth itself. He lives to explore the house.<br /><br />There is one other person in the house—a man called The Other, who visits Piranesi twice a week and asks for help with research into A Great and Secret Knowledge. But as Piranesi explores, evidence emerges of another person, and a terrible truth begins to unravel, revealing a world beyond the one Piranesi has always known.","description({\"stripped\":true})":"Alternate cover edition of ISBN 9781635575637.\r\n\r\nPiranesi’s house is no ordinary building: its rooms are infinite, its corridors endless, its walls are lined with thousands upon thousands of statues, each one different from all the others. Within the labyrinth of halls an ocean is imprisoned; waves thunder up staircases, rooms are flooded in an instant. But Piranesi is not afraid; he understands the tides as he understands the pattern of the labyrinth itself. He lives to explore the house.\r\n\r\nThere is one other person in the house—a man called The Other, who visits Piranesi twice a week and asks for help with research into A Great and Se "__typename":"TextReviewLanguageCount","count":9,"isoLanguageCode":"th"},{"__typename":"TextReviewLanguageCount","count":3,"isoLanguageCode":"tl"},{"__typename":"TextReviewLanguageCount","count":8,"isoLanguageCode":"gl"},{"__typename":"TextReviewLanguageCount","count":14,"isoLanguageCode":"zh-TW"},{"__typename":"TextReviewLanguageCount","count":1,"isoLanguageCode":"be"},{"__typename":"TextReviewLanguageCount","count":1,"isoLanguageCode":"kn"},{"__typename":"TextReviewLanguageCount","count":1,"isoLanguageCode":"bn"},{"__typename":"TextReviewLanguageCount","count":2,"isoLanguageCode":"eu"}]},"quotes({\"pagination\":{\"limit\":1}})":{"__typename":"ResourceQuotesConnection","webUrl":"https://www.goodreads.com/work/quotes/73586702","totalCount":305},"questions({\"pagination\":{\"limit\":1}})":{"__typename":"ResourceQuestionsConnection","totalCount":68,"webUrl":"https://www.goodreads.com/book/50202953/questions"},"topics({\"pagination\":{\"limit\":1}})":{"__typename":"ResourceTopicsConnection","webUrl":"https://www.goodreads.com/topic/list_book/50202953","totalCount":134},"viewerShelvings":null,"viewerShelvingsUrl":"/review/user_works/73586702","featuredKNH":{"__typename":"FeaturedKNHCollectionConnection","totalCount":0,"edges":[]},"giveaways":{"__typename":"GiveawaysConnection","edges":[]},"editions":{"__typename":"BooksConnection","webUrl":"https://www.goodreads.com/work/editions/73586702"}},"Review:kca://review:goodreads/amzn1.gr.review:goodreads.v1.quqGwuvmHbr2c-o49ac7Tw":{"__typename":"Review","id":"kca://review:goodreads/amzn1.gr.review:goodreads.v1.quqGwuvmHbr2c-o49ac7Tw","creator":{"__ref":"User:6431467"},"recommendFor":null,"updatedAt":1748869708339,"createdAt":1606872882654,"spoilerStatus":false,"lastRevisionAt":1748869707866,"text":"**<i>UPDATE: WOAH WHAT!? This is not only getting a <a href=\"https://www.kirkusreviews.com/news-and-features/articles/film-adaptation-of-piranesi-in-the-works/\" rel=\"nofollow noopener\">film adaptation</a> but it is going to be STOP MOTION I AM SO EXCITED!</i>**<br><br>Winner of the <a href=\"https://womensprizeforfiction.co.uk/features/features/news/announcing-the-2021-winner-of-the-womens-prize#:~:text=We%20are%20over%20the%20moon,with%20her%20second%20novel%20Piranesi.\" rel=\"nofollow noopener\">2021 Women's Prize for Fiction</a>.<br><br>‘<i>I was in a house with many rooms. The sea sweeps through the house. Sometimes it swept over me, but always I was saved.</i>’<br><br>An infinite labyrinth with an ocean inside, academic murder mysteries, many-worlds theories--<i>Piranesi</i> by Susanna Clarke has it <i>all</i>. This tightly written novel is endlessly engaging and so cinematic it feels more like something I have watched than read, which is blissful as I cannot stop thinking of the endless halls of The House with it’s many statues, changing weather patterns, ocean tides and of course, our friend Piranesi surviving it all. It’s a mixture of the show Lost meets the 90s computer game <a href=\"https://en.wikipedia.org/wiki/Myst\" rel=\"nofollow noopener\">Myst</a> with a touch of <a href=\"https://goodreads.com/author/show/500.Jorge_Luis_Borges\" title=\"Jorge Luis Borges\" rel=\"noopener\">Jorge Luis Borges</a> and some pompous English academics thrown in for good measure. Sure, it’s mostly plot for the sake of plot but it is infinitely fun and mind bending in ways that scratch all the right itches. A delightful meditation on belief and pursuit of knowledge combined with a boldly mysterious investigation into how and why the narrator exists in this surreal world, <i>Piranesi</i> is a sharp and witty adventure you should certainly lose yourself in.<br><br>‘<i>The beauty of the House is immeasurable; its Kindness infinite.</i>’<br><br>The story opens to the narrator describing his life in the House. It is an endless labyrinth of ‘<i>Classical architecture stitched together</i>’. These massive halls are filled with an eccentric assortment of statues are full of windows that look out upon the stars and the basement level of halls is flooded though with the tides the water occasionally washes up. The narrator is not alone, there are birds, fish he can catch and eat, and thirteen skeletons who he visits in a near-religious ceremony of food offerings and kind words. There is also The Other, an older man who roams the halls in search of a great power. The two men meet twice a week to discuss what they have discovered, though The Other may not be exactly all he seems, nor the narrator either. The narrator cannot remember life before the House, but keeps a detailed journal of his time there and concludes he must be in his mid thirties and have lived there for several years. The Other has named him Piranesi, after <a href=\"https://en.wikipedia.org/wiki/Giovanni_Battista_Piranesi\" rel=\"nofollow noopener\">Giovanni Piranesi,</a> an Italian Classical archaeologist, architect, and artist known for drawings of fantastical labyrinths and prisons. <br><img src=\"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/hostedimages/1606866389i/30457585._SX540_.jpg\" class=\"gr-hostedUserImg\" loading=\"lazy\"><br><br>Piranesi has come to know the House by memory and catalogues all he knows about it. He loves the House and feels it, too, loves him. <i>The World feels Complete and Whole, and I, its Child, fit into it seamlessly,</i>’ he writes. He looks upon the statues for guidance and in them finds messages of hope and strength. The House gives him food, gives him weather, gives him purpose even if it is only to serve as the inhabitant of the House. He has adapted to its rhythms, even creating his own calendar around the events of the house--the novel takes place in ‘<i>The Year the Albatross Came to the South-Western Halls</i>’. <br><br>This is a novel where not much can be said of the plot without spoiling the really delicious mysteries and the carefully plotted ways they are unveiled. I will do my best to speak obscurely of anything plot related.<br><br>Piranesi feels himself compelled to his work by a duty to science and understanding, though this differs from the ways The Other (and, as we learn, many others who seek the House) seeks knowledge about the House. Piranesi believes ‘<i>the House is valuable because it is the House. It is enough in and of Itself. It is not the means to an end.</i>’ He exists for its glory and for him that is enough. For The Other, however--and Lawrence Arne-Sayle--seek knowledge as a means to an end, for power and the glory it brings. While they claim to be ‘<i>doing it for humanity,</i>’ there is an aspect of ‘the ends justify the means’ which they will openly admit. There are many crimes obscured by the mystery of the quest for the House, which distort its glory to Piranesi.<br><blockquote>‘<i>I realised that the search for the Knowledge has encouraged us to think of the House as if it were a sort of riddle to be unravelled, a text to be interpreted, and that if ever we discover the Knowledge, then it will be as if the Value has been wrested from the House and all that remains will be mere scenery.</i>’</blockquote><br>Much of Piranesi borders on religious belief, though more of a spiritual belief in a natural world than anything. There are many pagan ideas infused into the novel, such as when Piranesi goes to one hall to see what constellations can be seen only to discover the statues appear to be arranged to stare at the moon which is perfectly centered in the hallway window. The date, as noted in his journal, is the ‘<i>twentieth day of the sixth month</i>’: the summer solstice. <br><br>What Piranesi has found in his comfortable communion with the House is, it would seem, not unlike the great power some have sought after. There is talk of the ‘<i>old ways</i>’ when humans could speak to nature and nature would speak back and bend to the wishes of humans. It is believed ‘<i>nothing simply vanishes</i>’ and it can be found again. But Piranesi, in his love for the House, already believes it communicates with him. He thanks it for the food it brings, for the shelter it provides, for all its wonders and beauty and kindness. ‘<i>The Tides themselves are full of movement and power so that, while they may not exactly be alive, neither are they not-alive,</i>’ he writes, and that ‘<i>we were drenched, we were numbed, we were blinded, we were deafened; but always we were saved.</i>’ His ways of speaking about the House as if it were a Deity resemble the sort of secrets the Other wishes to obtain but, in all his searching, cannot find it. Because he seeks it and does not simply live it, it cannot be seen. This becomes similar to protecting the environment and the way nature speaks to us when we strive for it. By having ravaged the land for the sake of wealth and power, we have nearly killed it and each other but if we listen to the world and live sustainably we can all thrive.<br><br>This becomes a novel about transgressive ideas, though not in the way that many originally thought them to be (repeatedly pointing out that Lawrence was gay solely to demonstrate all the ways he was ‘transgressive in nature’ is pretty uncool of the author though). While thinking outside the norm makes one an outcast, what we discover is that what they were thinking wasn’t odd but the way they would go about using that knowledge and the means to obtain it. The halls are either a curio to be exploited, or something to cherish, and the meaning of them is different for every character. This book gets really sinister, and the way it creeps up on you is almost akin to horror aesthetics.<br><br><i>Piranesi</i> is a wild, twisted and surreal ride that is unfolds so well by constantly teasing insight and toying with tension that it’s nearly impossible to put down. The opening section could easily have been extended with 100 pages of him simply exploring the halls and I would have loved it, so my only real criticism here is that it was a bit too plot heavy when it could have breathed more. But I so enjoyed living in the images in my head--the atmosphere of this novel is fantastic and will bring you to such stunning places. This is a really fun and fascinating look at the pursuit of knowledge and how sometimes it goes too far and for the wrong reasons. A really worthwhile weekend read, you will definitely want to get lost in the halls of the House.<br><br><b>4/5</b><br><br>‘<i>May your Paths be safe, your Floors unbroken and may the House fill your eyes with Beauty.</i>’<br><img src=\"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/hostedimages/1606866270i/30457583.jpg\" class=\"gr-hostedUserImg\" loading=\"lazy\">","rating":4,"preciseRating":4,"preReleaseBookSource":null,"shelving":{"__ref":"Shelving:{\"creator\":{\"id\":\"kca://profile:goodreads/A2YMIYVSECWDQH\"},\"book\":{\"id\":\"kca://book/amzn1.gr.book.v3.5dYsgrvLZPPvUFeL\"}}"},"likeCount":1139,"viewerHasLiked":null,"commentCount":69},"Book:kca://book/amzn1.gr.book.v3.OQACAH2RuroiUGK-":{"__typename":"Book","id":"kca://book/amzn1.gr.book.v3.OQACAH2RuroiUGK-"},"Review:kca://review:goodreads/amzn1.gr.review:goodreads.v1.8Ufq_2lPWnsZ4eNaT-AeGA":{"__typename":"Review","id":"kca://review:goodreads/amzn1.gr.review:goodreads.v1.8Ufq_2lPWnsZ4eNaT-AeGA","creator":{"__ref":"User:3672777"},"recommendFor":null,"updatedAt":1678055838497,"createdAt":1601612859014,"spoilerStatus":false,"lastRevisionAt":1644027429082,"text":"<blockquote>\n  <i> “The Beauty of the House is immeasurable; its Kindness infinite.”</i>\n</blockquote>First of all, for those who - like me - read the blurb for this book, noted the mention of <i>“the house with the ocean imprisoned in it”</i> and automatically assumed that “Piranesi” has something to do with piranhas (because ocean = fish, right?) — yeah, that’s certainly not what the story is about. Regrettably, there’s not a single piranha in sight.<br>———<br>———<br>This is like a dream, slow, strange and intensely atmospheric, unbelievably immersive and engrossing. Imagine a labyrinthine partially ruined “House” with endless procession of interconnected enormous Halls and Vestibules, with bottom levels flooded by the ocean somehow held inside, and top layers covered in thick clouds, with enormous marble staircases covered by clashing Tides, and thousands upon thousands of marble statues.<b> No entrances or exits, just the House that is the World, both decrepitude and perfection.</b><br><blockquote>\n  <i> “I am determined to explore as much of the World as I can in my lifetime. To this end I have travelled as far as the Nine-Hundred-and-Sixtieth Hall to the West, the Eight-Hundred-and-Ninetieth Hall to the North and the Seven-Hundred-and-Sixty-Eighth Hall to the South. I have climbed up to the Upper Halls where Clouds move in slow procession and Statues appear suddenly out of the Mists. I have explored the Drowned Halls where the Dark Waters are carpeted with white water lilies. I have seen the Derelict Halls of the East where Ceilings, Floors – sometimes even Walls! – have collapsed and the dimness is split by shafts of grey Light.”</i>\n</blockquote><br><blockquote>\n  <img src=\"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/hostedimages/1601600365i/30181851._SX540_.jpg\" width=\"400\" class=\"gr-hostedUserImg\" loading=\"lazy\">\n</blockquote><br>It’s not a dead world. There are birds and fish and remains of thirteen humans, and two living ones - <b>the Other</b>, a man who visits our narrator for hour-long appointments twice a week on the search for mysterious Knowledge, a man clearly of the world that is similar to our own, and <b>our narrator who the Other refers to as Piranesi</b>, although “Piranesi” knows that it’s not his name. <br><blockquote>\n  <i>“Since the World began it is certain that there have existed fifteen people. Possibly there have been more; but I am a scientist and must proceed according to the evidence. Of the fifteen people whose existence is verifiable, only Myself and the Other are now living.”</i>\n</blockquote><br>Piranesi has no memory of ever being anywhere else. <b>He has always been here, or at least from 2012 and until the Year the Albatross Came to the South-Western Halls</b>. He is the Beloved Child of the House, worshipful of its beauty and kindness, grateful for the survival it allows him, full of wondrous innocence and remarkable naïveté to the point where you fervently hope that he indeed loses some of that innocence before it’s too late. <b>And you know that things are wrong. </b>You know he has not always been here. You know from everything he refers to that his world used to be much bigger than the enormous half-derelict labyrinthine House.<br><blockquote>\n  <i>“I realised that the search for the Knowledge has encouraged us to think of the House as if it were a sort of riddle to be unravelled, a text to be interpreted, and that if ever we discover the Knowledge, then it will be as if the Value has been wrested from the House and all that remains will be mere scenery.<br>The sight of the One-Hundred-and-Ninety-Second Western Hall in the Moonlight made me see how ridiculous that is. The House is valuable because it is the House. It is enough in and of Itself. It is not the means to an end.”</i>\n</blockquote><blockquote>\n  <img src=\"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/hostedimages/1601600365i/30181852._SX540_.jpg\" width=\"400\" class=\"gr-hostedUserImg\" loading=\"lazy\">\n</blockquote>It’s the story of kindness and gratitude. <b>It’s the story of loneliness and solitude and isolation. It’s the story of reverence and contemplation, ingenuity and survival, innocence and evil, curiosity and contentment. </b>It’s a story rooted in living in the present because the past is nonexistent, untroubled by the questions of identity, resistant to egotistical impulses - because Piranesi seems to know exactly who he is, the “Beloved Child of the House”. Even the harshest things that happen to him seem to have a silver lining through his attitude of acceptance and gratitude.<br><blockquote>\n  <i> “It occurs to me that there are many other ideas that I understand perfectly, even though no such things exist in the World.”</i>\n</blockquote><br>Piranesi’s acceptance of his life is quietly unsettling, his innocence frustrating, his equanimity troubling, his obliviousness infuriating, his kindness at times disturbing, his adaptability admirable, and his content lack of curiosity puzzling. And the further you read the more your apprehension grows. <b>The House is a sanctuary and a prison at the same time, both beckoning and terrifying at the same time</b>. After all, <a href=\"https://en.wikipedia.org/wiki/Giovanni_Battista_Piranesi\" rel=\"nofollow noopener\">his historical namesake Piranesi</a> was known for his “Imaginary Prisons” etchings - no, not coincidental at all.<br><blockquote>\n  <i>“Batter-Sea is not a word,’ I said at last. ‘It has no referent. There is nothing in the World corresponding to that combination of sounds.”</i>\n</blockquote><br>And so the entire story fluctuates between seductive and devastating, and remains quietly memorable. It’s a puzzle and a treasure, fragile yet powerful, and a meditation on life in a curiously small universe.<br><br>The point of this story for me was not the mystery of the house or of Piranesi’s identity; the clues are there and it’s not too hard to figure most of it out rather early on. No, the strength is the strange world that Clarke creates so vividly that I felt that I was walking the Halls and avoiding the Tides and listening to the messages the House sends and catching a glimpse of the Moon along with Piranesi. His hypnotic voice - the voice of the timeless scientist - transported me fully into this strange orderly confusion and left me spellbound. And that was the spell I did not want to end.<br><br>The magic exists. And somewhere there may be a place where you can finally be at peace. Maybe. Depending on what you can give up. Depending if you feel trapped or free in your own personal labyrinth.<br><br><b>Gentle and quiet and powerful.<br><br>4 stars.</b><blockquote>\n  <i> “The Beauty of the House is immeasurable; its Kindness infinite.”</i>\n</blockquote><br>———————<br><br>My Hugo and Nebula Awards Reading Project 2021: <a target=\"_blank\" rel=\"noopener nofollow\" href=\"https://www.goodreads.com/review/show/3701332299\">https://www.goodreads.com/review/show...</a><br><br>——————<br>Also posted on <a href=\"https://nataliyabookblog.wordpress.com/2022/02/04/2020-piranesi-by-susanna-clarke/\" rel=\"nofollow noopener\">my blog</a>.<br>","rating":4,"preciseRating":4,"preReleaseBookSource":null,"shelving":{"__ref":"Shelving:{\"creator\":{\"id\":\"kca://profile:goodreads/A3MFW2SZ8CQ797\"},\"book\":{\"id\":\"kca://book/amzn1.gr.book.v3.OQACAH2RuroiUGK-\"}}"},"likeCount":1729,"viewerHasLiked":null,"commentCount":101},"Review:kca://review:goodreads/amzn1.gr.review:goodreads.v1.vvkNg2XkpO-Ik9AAnQOtbg":{"__typename":"Review","id":"kca://review:goodreads/amzn1.gr.review:goodreads.v1.vvkNg2XkpO-Ik9AAnQOtbg","creator":{"__ref":"User:8734459"},"recommendFor":null,"updatedAt":1721766195764,"createdAt":1600784140510,"spoilerStatus":false,"lastRevisionAt":1633735017742,"text":"A second fantasy novel from the author of <a href=\"https://goodreads.com/book/show/14201.Jonathan_Strange___Mr_Norrell\" title=\"Jonathan Strange &amp; Mr Norrell by Susanna Clarke\" rel=\"noopener\">Jonathan Strange &amp; Mr Norrell</a> — finally!! It's excellent, and VERY different from Jonathan Strange (for one thing, it's less than 250 pages). Review first posted on <a href=\"http://www.fantasyliterature.com/reviews/piranesi/\" rel=\"nofollow noopener\">Fantasy Literature</a> (along with my co-reviewer Bill's excellent review, which I reference a couple of times below): <br><br>I have to say I was a smidgen disappointed to get to the end of <i>Piranesi</i> and not have seen a single footnote (I’m quite fond of all of the quasi-scholarly, tongue-in-cheek footnotes in <i>Jonathan Strange and Mr Norrell</i>). But that was my only disappointment with this transcendent novel. <br><br><img src=\"https://i.gr-assets.com/images/S/compressed.photo.goodreads.com/hostedimages/1600921981i/30146088._SX540_.jpg\" width=\"400\" height=\"330\" alt=\"description\" class=\"gr-hostedUserImg\" loading=\"lazy\"><br><i>An etching by Giovanni Battista Piranesi, 18th century Italian artist</i><br><br>Piranesi, who narrates this story through his journal entries, is the sole living inhabitant of a labyrinthine, half-ruined building he calls the House. He also calls it the World, which in a very real sense it is for him: he has no memory of living anywhere except in the House, which is an endless series of halls and vestibules, with no entrances or exits, where ocean waves and floods beset the lower levels but also provide him with life-preserving food, tools, and fuel. It’s reminiscent of Jorge Luis Borges’ <a href=\"https://goodreads.com/book/show/172366.The_Library_of_Babel\" title=\"The Library of Babel by Jorge Luis Borges\" rel=\"noopener\">The Library of Babel</a>, except with awe-inspiring statues in every room rather than (near)infinite books, as well as Borges’ “<a href=\"https://goodreads.com/book/show/51196789.The_House_of_Asterion\" title=\"The House of Asterion by Jorge Luis Borges\" rel=\"noopener\">The House of Asterion</a>.” Piranesi has found a baker’s dozen of human skeletons in the House, which he religiously cares for, but the only other living person he has seen there is the man he calls the Other, who visits with him briefly twice a week and irritably quizzes him on his explorations of the House.<br><br>To paraphrase Winston Churchill, Piranesi — the character as well as the book itself — is a riddle (who is he?), wrapped in a mystery (why is he in the House, and what does the Other have to do with it?), inside an enigma (what <i>is</i> the House?). I felt compelled to pencil notes in the margins of my brand-new hardcover copy of <i>Piranesi</i> (“Minotaurs!”) and mark key passages. Note-taking did have the benefit of slowing me down and making me think more deeply about the layered mysteries, the symbols and allusions and ironies. Piranesi’s and (when it’s revealed) the Other’s names, like Clarke’s suggestive epigraphs at the beginning of the novel, are clues that readers may or may not want to pursue before getting deeper into the book. (I would absolutely love to be a student in Bill’s class on <i>Piranesi</i>!)<br><br>For as Bill comments, there’s a delight in simply inhabiting the House with Piranesi. It’s a beautifully described world, and Piranesi is a wonderful companion, brimful with good-hearted innocence, trust, and a joyous sense of wonder. His harmony with nature and his selflessness are inspiring, as when he gives up a large chunk of his precious store of dried seaweed (which is both food and fuel to him) so that a pair of albatrosses can build a nest.<blockquote>It approximated to three days’ fuel. This was no insignificant amount and I knew that I might be colder because I had given it away. But what is a few days of feeling cold compared to a new albatross in the World?</blockquote>To get too caught up in the details and the whys and hows of the ever-present, looming mysteries is to risk diluting the ability to immerse yourself in Piranesi’s hauntingly beautiful life and world. When the answers begin to be disclosed, it’s fascinating but at the same time a dose of the mundane, bringing the ineffable, at least partially, down to earth. The latter part of the book shifts tone to more of a suspense novel, with some heart-pounding moments of tension and danger. But then, there’s a marvelous ending that brings us full circle, back to that initial sense of wonder and awe.<blockquote>In my mind are all the tides, their seasons, their ebbs and their flows. In my mind are all the halls, the endless procession of them, the intricate pathways. … The Beauty of the House is immeasurable; its Kindness infinite.</blockquote>It’s a testament to the power of Clarke’s storytelling that those lines almost brought me to tears. <i>Piranesi</i> is an extraordinary and thoughtful novel with radiant writing, illuminating our own lives.","rating":5,"preciseRating":5,"preReleaseBookSource":null,"shelving":{"__ref":"Shelving:{\"creator\":{\"id\":\"kca://profile:goodreads/A3LRFNSV8XHW2K\"},\"book\":{\"id\":\"kca://book/amzn1.gr.book.v3.5dYsgrvLZPPvUFeL\"}}"},"likeCount":893,"viewerHasLiked":null,"commentCount":50},"Book:kca://book/amzn1.gr.book.v3.sME3imGQuJbLMRK5":{"__typename":"Book","id":"kca://book/amzn1.gr.book.v3.sME3imGQuJbLMRK5"},"Review:kca://review:goodreads/amzn1.gr.review:goodreads.v1.bS8YVKf0BWf8EQm9Kag3Nw":{"__typename":"Review","id":"kca://review:goodreads/amzn1.gr.review:goodreads.v1.bS8YVKf0BWf8EQm9Kag3Nw","creator":{"__ref":"User:30181442"},"recommendFor":null,"updatedAt":1774905903045,"createdAt":1642097580083,"spoilerStatus":false,"lastRevisionAt":1774905903045,"text":"Umm, is that it?<br /><br />Ok, let me start by first apologizing to everyone who loves this book. Obviously, I'm an outlier and my thoughts here are decidedly in the minority. So if you feel differently, please don't throw rotten vegetables at me. <br /><br />Going into <i>Piranesi</i>, I had heard nothing but great things about it. How it's riveting and unputdownable. How no one had ever seen a story like this before. How the twist is going to blow my mind. Unfortunately, none of those turned out to be true for me.<br /><br />For one thing—and please forgive for saying this—I just don't find endless descriptions of halls, statues, vestibules, tides, fish, and birds to be that interesting. I know, I can't believe I just admitted such a thing publicly. But that is the majority of this book! It was tolerable for the first thirty pages, when I worked hard to read and reread each description slowly so that I may keep straight every hall, statue, vestibule, tide, fish, and bird encountered. But I soon grew tired and just proceeded to read without retaining.<br /><br />And it wouldn't be a big deal if the only issue with this book is its excessive descriptions. After all, I've read plenty of books like that and still eked out some enjoyment. But here, the descriptions are in combination with writing I couldn't make heads or tails of. I'll be honest, I barely understood most of the sentences, paragraphs, and chapters, no matter how much I concentrated or how many times I reread it.<br /><br />So what's the problem? Well, for me, I just don't see a point to reading like that. When the writing is such that it isn't meant to be understood or remembered, but rather just skimmed to reach the end, then why am I even reading it? Sure, I wiled away some time turning the pages, but I ultimately come away unchanged, and for me, that is the worst result a story can achieve.<br /><br />For such a short book, this sure was a slog. Lots of readers report reading it in one sitting because they couldn't put it down. It took me three days of dedicated reading time to get through it. Every time I put it down, I had no urge to pick it back up. The only reason I kept going is the promise of that great twist.<br /><br />And here, my expectations were wrong too. For me, a twist means that the story is leading the reader in one direction, but then a development happens that takes the story in a completely different, unforeseen direction. Thus, the reader is surprised. But that didn't happen here. This book clearly leads you in one direction, and the reveal is exactly what you would expect from it.<br /><br />Perhaps if you didn't know the book's genre going in (not sure how you'd be able to swing that though), this development would come as a surprise. But it's a fairly common concept. So to prevent the reader from figuring things out early, the book is written such that it maximumly obscures everything. Keeping the reader in this haze-like, confused state for as long as possible is the goal of this story.<br /><br />And when we do reach the end, no actual explanation of the logistics are given. The how's and why's are just handwaved away. I don't mind being taken for a ride, but the destination had better be worth it. And it wasn't here. I expected creative and original, but I only ended up with derivative and unsatisfying.<br /><br />I know not every book is for every reader, and this one definitely isn't for me. I marvel at stories that take complex and intricate ideas and turn them into something easily understood. This is the opposite. It takes a fairly simple concept that's been done many times before and somehow manages to turn it into the most obscure and confounding tale. No, thank you.<br /><br />~~~~~~~~~~~~<br />✧ <i>Connect with me</i> ✧ <i><a href=\"https://www.instagram.com/missreadaroo/\" rel=\"nofollow noopener\">Instagram</a> </i>✧<br /><br />","rating":1,"preciseRating":1,"preReleaseBookSource":null,"shelving":{"__ref":"Shelving:{\"creator\":{\"id\":\"kca://profile:goodreads/A1K32T1C55JI4N\"},\"book\":{\"id\":\"kca://book/amzn1.gr.book.v3.sME3imGQuJbLMRK5\"}}"},"likeCount":4100,"viewerHasLiked":null,"commentCount":643},"Review:kca://review:goodreads/amzn1.gr.review:goodreads.v1.EAyfkCtNRGLCnu5RK5JsAQ":{"__typename":"Review","id":"kca://review:goodreads/amzn1.gr.review:goodreads.v1.EAyfkCtNRGLCnu5RK5JsAQ","creator":{"__ref":"User:70046142"},"recommendFor":null,"updatedAt":1647794720242,"createdAt":1600564048141,"spoilerStatus":false,"lastRevisionAt":1624145484548,"text":"I almost DNFed this one, and maybe I should have, but in the end I wanted to be able to fully review this book and I don’t think it’s fair to do that only having read half of it.<br /><br />This is a book that falls into a category I’ve come to describe as for <i>A Certain Kind of Reader</i>®. Maybe that’s a phrase you’ve heard before, but for me it namely means that most readers will not like it, but a segment of them will LOVE it. If you’re a Bestsellers reader, you probably won’t like this. If you’re a Book Club reader, you probably won’t like this. If you’re a Genre reader (fantasy, thriller, etc.) you probably won’t like this. <br /><br />Who will like this? Readers who do not mind wandering around aimlessly through the first 100 pages of a 250 page book. Also, most likely readers who enjoy the types of literary fiction that can be alienating to the average person. I’m not trying to be dismissive of these books, I read and like some of them! But I‘ll sheepishly admit that I sometimes feel like I’m too dumb to understand other ones, and I wonder if some are so abstract and inaccessible by design.<br /><br />So what’s the deal with Piranesi? Basically there’s a guy in tunnels? Or caves? That’s just incurably confused and doesn’t know it. He’s unreliable as a narrator, but he’s also extremely boring. The labyrinth he finds himself in is somewhat more interesting, but he spends most of his time studying tides or talking to birds, then writing it all down. Reading this was a good deal more frustrating than it was fascinating for me, unfortunately. I got about halfway and honestly did not want to keep reading. Yes, things are eventually uncovered and revealed, but the journey to get there was just nooooot worth it.<br /><br />I can’t remember reading a book so short that was also way too long. I saw someone mention this should be a novella—I fully support that! You could cut the length in half and essentially lose nothing important. I wish I had read the author’s other book so I could compare this to it, but I have not. And based off of the length of that one and how long this felt, I don’t know if I’m up for it. Additionally, <i>Piranesi</i> was compared to <a href=\"https://goodreads.com/author/show/176372.Madeline_Miller\" title=\"Madeline Miller\" rel=\"noopener\">Madeline Miller</a>—I do not see that comparison AT ALL. I loved <a href=\"https://goodreads.com/book/show/35959740.Circe\" title=\"Circe by Madeline Miller\" rel=\"noopener\">Circe</a> and <a href=\"https://goodreads.com/book/show/11250317.The_Song_of_Achilles\" title=\"The Song of Achilles by Madeline Miller\" rel=\"noopener\">The Song of Achilles</a> and do not understand what the two have in common, except, maybe Clarke references Greek mythology? The writing styles are <i>completely</i> different.<br /><br />That said, <i>Piranesi</i> continues to have a really high rating on Goodreads, so who knows! Maybe check out some other reviews as there are plenty of positive ones to choose from. I’m sure Susanna Clarke is doing something very unique and probably clever here, but I’m just not clicking with it. Maybe you’re exactly this book’s Certain Kind of Reader.<br /><br /><br />**<i>For more book talk &amp; reviews, <a href=\"https://www.instagram.com/elle_mentbooks/\" rel=\"nofollow noopener\">follow me on Instagram at @elle_mentbooks</a>!</i>","rating":3,"preciseRating":3,"preReleaseBookSource":null,"shelving":{"__ref":"Shelving:{\"creator\":{\"id\":\"kca://profile:goodreads/A37DT3513Z1CYH\"},\"book\":{\"id\":\"kca://book/amzn1.gr.book.v3.5dYsgrvLZPPvUFeL\"}}"},"likeCount":1719,"viewerHasLiked":null,"commentCount":148},"Contributor:kca://author/amzn1.gr.author.v1.5rvlBzs9-qod6SCeX1N8xw":{"__typename":"Contributor","id":"kca://author/amzn1.gr.author.v1.5rvlBzs9-qod6SCeX1N8xw","works":{"__typename":"ContributorWorksConnection","totalCount":64}},"Contributor:kca://author/amzn1.gr.author.v1.VT_YAYt8VDDNbv2D4rnTHQ":{"__typename":"Contributor","id":"kca://author/amzn1.gr.author.v1.VT_YAYt8VDDNbv2D4rnTHQ","works":{"__typename":"ContributorWorksConnection","totalCount":33}},"Book:kca://book/amzn1.gr.book.v3.nqW6u1CeVwLzv66r":{"__typename":"Book","id":"kca://book/amzn1.gr.book.v3.nqW6u1CeVwLzv66r"},"Contributor:kca://author/amzn1.gr.author.v1.G5axoaTYN8w0ZyJsfMZJZQ":{"__typename":"Contributor","id":"kca://author/amzn1.gr.author.v1.G5axoaTYN8w0ZyJsfMZJZQ","works":{"__typename":"ContributorWorksConnection","totalCount":86}},"Contributor:kca://author/amzn1.gr.author.v3.ZVJiiZ-H6NV3eOu6":{"__typename":"Contributor","id":"kca://author/amzn1.gr.author.v3.ZVJiiZ-H6NV3eOu6","works":{"__typename":"ContributorWorksConnection","totalCount":1}},"Book:kca://book/amzn1.gr.book.v3.I9fFrCCL2GkFycWf":{"__typename":"Book","id":"kca://book/amzn1.gr.book.v3.I9fFrCCL2GkFycWf"}},"apiKey":null,"dataSource":null}}}</script></body></html>
