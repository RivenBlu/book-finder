<script type="application/ld+json">{"@context": "http://schema.org","@type": "Book","name":"Okruchy dnia","isbn":"9788384393123","datePublished":"2026-08-12","url":"https://lubimyczytac.pl/ksiazka/5249583/okruchy-dnia","genre":"https://lubimyczytac.pl/ksiazki/k/39/literatura-piekna","inLanguage":"polski","numberOfPages":"304","image":"https://s.lubimyczytac.pl/upload/books/5249000/5249583/1380081-352x500.jpg","author":{"@type":"Person","name":"Kazuo Ishiguro","url":"https:\/\/lubimyczytac.pl\/autor\/16558\/kazuo-ishiguro"},"aggregateRating":{"@type":"AggregateRating","worstRating":1,"bestRating":10,"ratingValue":"7,4","ratingCount":4428},"review":[{"@type":"Review","datePublished":"2026-02-10 22:43:08.428424","url":"https:\/\/lubimyczytac.pl\/ksiazka\/5249583\/okruchy-dnia#opinie","author":{"@type":"Person","name":"Arek Czytalski","url":"https:\/\/lubimyczytac.pl\/profil\/1112\/arek-czytalski"},"reviewBody":"\u201eLudzie z kontynentu nie potrafi\u0105 by\u0107 kamerdynerami, poniewa\u017c s\u0105 jako rasa niezdolni do takiego okie\u0142znania uczu\u0107, jakie wy\u0107wiczy\u0142 w sobie nar\u00f3d angielski.\u201d\n\n\u201eOkruchami dnia\u201d rozpoczynam literack\u0105 przygod\u0119 z tw\u00f3rczo\u015bci\u0105 brytyjskiego noblisty, pochodzenia japo\u0144skiego. Po \u017cmudnej, nu\u017c\u0105cej lekturze nie mam pewno\u015bci czy zdo\u0142am kiedy\u015b przekona\u0107 si\u0119 do pi\u00f3ra Kazuo Ishiguro.\n\nAutor podobnie jak Haruki Murakami opowiada o prostym \u017cyciu, zwyk\u0142ych ludzi, z t\u0105 r\u00f3\u017cnic\u0105 \u017ce w tej kameralnej powie\u015bci brak element\u00f3w realizmu magicznego, oniryzmu kt\u00f3re przykuwa\u0142y m\u0105 uwag\u0119 u Murakami'ego. Pisarz prowadzi pi\u00f3ro starannie, elegancko, ale rozwleka ma\u0142o interesuj\u0105ce w\u0105tki, takie jak opis obowi\u0105zk\u00f3w kamerdynera. \n\nPrzyznaj\u0119, uwierzy\u0142em w literack\u0105 kreacj\u0119 postaci, w mej wyobra\u017ani pobudzonej lektur\u0105 wygl\u0105da\u0142y one ca\u0142kiem realnie. Do dialog\u00f3w te\u017c nie mam zastrze\u017ce\u0144, potwierdzi\u0142y me wyobra\u017cenia o bohaterach uwypuklaj\u0105c ich cechy. Najs\u0142abszym elementem okaza\u0142a si\u0119 anemiczna, nieciekawa fabu\u0142a zniech\u0119caj\u0105ca do dalszej lektury. Nie znalaz\u0142em w tej historii elementu zaskoczenia, nie wyczu\u0142em nawet nik\u0142ego napi\u0119cia.\n\nNagrodzonej Bookerem trzystu-stronicowej powie\u015bci stawiam 7\/10.","reviewRating":{"@type":"Rating","ratingValue":"7","bestRating":"10","worstRating":"1"}},{"@type":"Review","datePublished":"2023-01-31 09:26:10.572448","url":"https:\/\/lubimyczytac.pl\/ksiazka\/5249583\/okruchy-dnia#opinie","author":{"@type":"Person","name":"Boles\u0142aw Rychlik","url":"https:\/\/lubimyczytac.pl\/profil\/1945562\/boleslaw-rychlik"},"reviewBody":"Ju\u017c od dawna mia\u0142em w planach spenetrowanie tw\u00f3rczo\u015bci pana Kazuo Ishiguro, a to dlatego, \u017ce Noblista (2017),a to, \u017ce zakupiona ksi\u0105\u017cka le\u017cy na p\u00f3\u0142ce od jakiego\u015b czasu i czeka, zerkaj\u0105c zach\u0119caj\u0105co swym grzbietem w moj\u0105 stron\u0119, no i jeszcze dlatego, \u017ce film ogl\u0105da\u0142em pod tym samym tytu\u0142em w re\u017cyserii Jamesa Ivory\u2019ego z doskona\u0142ymi rolami mojego ulubionego aktora Anthonyego Hopkinsa jako James Stevens i r\u00f3wnie cenionej przeze mnie Emmy Thompson jako Sarah \u201eSally\u201d Kenton.\nPowie\u015b\u0107 \u201eOkruchy dnia\u201d jest pierwsz\u0105 pozycj\u0105 z dorobku Kazuo Ishiguro, kt\u00f3r\u0105 mia\u0142em zaszczyt przeczyta\u0107 i ju\u017c wiem, \u017ce nie b\u0119dzie to z pewno\u015bci\u0105 pozycja, na kt\u00f3rej zako\u0144cz\u0119 swoj\u0105 czytelnicz\u0105 przygod\u0119 z tym autorem.\nIshiguro i jego Okruchy dnia wywar\u0142y na mnie ogromne wra\u017cenie, autor urzek\u0142 mnie pi\u0119knem swego dzie\u0142a, jego lekko\u015bci\u0105, prostot\u0105, a jednocze\u015bnie elegancj\u0105 i g\u0142\u0119bi\u0105 przekazu- po tym w\u0142a\u015bnie poznaje si\u0119 tych wielkich, tych z najwy\u017cszego \u015bwiecznika \u015bwiatowej literatury, \u017ce podejmuj\u0105c tematy- zda\u0142oby si\u0119 z pozoru banalne, potrafi\u0105 wok\u00f3\u0142 nich kr\u0105\u017cy\u0107 delikatnie, opadaj\u0105c po spirali: pragnie\u0144, t\u0119sknot, marze\u0144 i obaw, ukazuj\u0105c czytelnikowi niczym w zwierciadle jego w\u0142asne odbicie, mo\u017ce nieco zniekszta\u0142cone poprzez czas i przestrze\u0144, mo\u017ce ogl\u0105dane pod innym k\u0105tem i z nieco innej perspektywy, ale jednak odbicie.\nNajpi\u0119kniejsza w Okruchach dnia jest narracja, prowadzona spokojnie i z namys\u0142em, ka\u017cde s\u0142owo, zdanie, przecinek i kropka s\u0105 przemy\u015blane i umiejscowione doskonale na swoim miejscu, nie szukaj\u0105 poklasku: nie powalaj\u0105 wartko\u015bci\u0105 i tempem rodem z Harry\u2019ego Pottera, nie opieraj\u0105 si\u0119 na tanich chwytach marketingowych...one p\u0142yn\u0105 swym nurtem spokojnie, bez pospiechu kropla po kropli dr\u0105\u017c\u0105c pow\u0142ok\u0119 czytelniczej wra\u017cliwo\u015bci.\nKazuo Ishiguro ukazuje nam rzeczywisto\u015b\u0107 minion\u0105, kt\u00f3rej nijak odmieni\u0107 nie jeste\u015bmy w stanie, cho\u0107 by\u015bmy si\u0119 nie wiem, jak starali- nie jeste\u015bmy w stanie zmieni\u0107, poprawi\u0107, naprawi\u0107, czy w jakikolwiek inny spos\u00f3b wp\u0142yn\u0105\u0107 na to, co by\u0142o, mo\u017cemy jedynie spr\u00f3bowa\u0107 zado\u015b\u0107uczyni\u0107, mo\u017ce nawet przeprosi\u0107 zw\u0142aszcza samego siebie przeprosi\u0107, \u017ce postawili\u015bmy na niew\u0142a\u015bciwe liczby w ruletce \u017cycia i zacz\u0105\u0107 wszystko od nowa...najlepiej od zaraz. Polecam.","reviewRating":{"@type":"Rating","ratingValue":"10","bestRating":"10","worstRating":"1"}},{"@type":"Review","datePublished":"2023-11-06 18:04:31.182581","url":"https:\/\/lubimyczytac.pl\/ksiazka\/5249583\/okruchy-dnia#opinie","author":{"@type":"Person","name":"Karol Kordyl","url":"https:\/\/lubimyczytac.pl\/profil\/2239632\/karol-kordyl"},"reviewBody":"Jest to ksi\u0105\u017cka wielowymiarowa, mo\u017ce si\u0119 wydawa\u0107 \u017ce nic si\u0119 w niej nie dzieje, nic bardziej mylnego, dzieje si\u0119 i to bardzo du\u017co. G\u0142\u00f3wny bohater po\u015bwi\u0119ca si\u0119 bez reszty swojej pracy przez co \u017cycie ucieka mu przez palce, przeplata si\u0119 tutaj te\u017c w\u0105tek drugiej wojny \u015bwiatowej i do\u015b\u0107 kontrowersyjny temat wsp\u00f3\u0142pracy wp\u0142ywowych polityk\u00f3w angielskich z nazistami. Jest to ksi\u0105\u017cka bardzo &quot;angielska&quot;, g\u0142\u00f3wny bohater jest a\u017c na wskro\u015b przesi\u0105kni\u0119ty og\u0142ad\u0105 towarzysk\u0105, takim angielskim starannym wychowaniem. Ksi\u0105\u017ck\u0119 dobrze i szybko si\u0119 czyta.","reviewRating":{"@type":"Rating","ratingValue":"7","bestRating":"10","worstRating":"1"}},{"@type":"Review","datePublished":"2023-12-09 12:38:58.445697","url":"https:\/\/lubimyczytac.pl\/ksiazka\/5249583\/okruchy-dnia#opinie","author":{"@type":"Person","name":"Jacaff89","url":"https:\/\/lubimyczytac.pl\/profil\/2094875\/jacaff89"},"reviewBody":"Audiobook.\nJak dla mnie zwyk\u0142a opowie\u015b\u0107 o cz\u0142owieku dumnym \u017ce swojego zaj\u0119cia.....oddaj\u0105c si\u0119 si\u0119 swojej pracy w 100% nasz g\u0142\u00f3wny bohater zaniedbuje swoje prywatne \u017cycie i mo\u017ce straci\u0107 szans\u0119 na mi\u0142o\u015b\u0107....\nNic odkrywczego to raz a dwa te\u017c bez fajerwerk\u00f3w je\u015bli chodzi o ubranie tej historii w s\u0142owa...\n6 w ocenie to jest maks co mog\u0119 da\u0107 tej lekturze.","reviewRating":{"@type":"Rating","ratingValue":"6","bestRating":"10","worstRating":"1"}},{"@type":"Review","datePublished":"2018-11-04 15:36:11.376041","url":"https:\/\/lubimyczytac.pl\/ksiazka\/5249583\/okruchy-dnia#opinie","author":{"@type":"Person","name":"Gosia","url":"https:\/\/lubimyczytac.pl\/profil\/145651\/gosia"},"reviewBody":"Gorzki rozrachunek z \u017cyciem.\nOstatnie dwie ksi\u0105\u017cki to prawdziwa uczta literacka. Na pierwsze danie by\u0142 Modiano, teraz na drugie inny laureat literackiego Nobla - Kazuo Ishiguro.\nWspomnienia angielskiego kamerdynera w jesieni \u017cycia podczas podr\u00f3\u017cy przez Angli\u0119 do dawnej gospodyni w rezydencji, w kt\u00f3rej wiele lat razem pracowali.\nPodczas tej podr\u00f3\u017cy snuje on rozwa\u017cania na temat swojej pracy, poj\u0119cia obowi\u0105zku i godno\u015bci, odgrodzenia prywatnego \u017cycia od zawodowego.\nWybitny portret psychologiczny postaci.\nPrzeczyta\u0142am ju\u017c trzy inne powie\u015bci Kazuo Ishiguro i musz\u0119 stwierdzi\u0107, \u017ce ta jest do\u015b\u0107 odmienna, najbardziej realna z nich wszystkich, brak w niej tych onirycznych fragment\u00f3w, bardziej dominuje smutek i nostalgia, cho\u0107 i tych nie brak w innych jego ksi\u0105\u017ckach.\nBardzo zadziwia mnie fakt, jak ten - Japo\u0144czyk z pochodzenia - wszed\u0142 w sk\u00f3r\u0119 brytyjskiego kamerdynera. To a\u017c niebywa\u0142e.\nWiele lat temu ogl\u0105da\u0142am doskona\u0142a ekranizacj\u0119 tej ksi\u0105\u017cki. Nie wyobra\u017cam sobie ju\u017c kogo\u015b innego w roli kamerdynera Stevensa i panny Kenton ni\u017c Anthony'ego Hopkinsa i Emmy Thompson. Nie na darmo posiada on tytu\u0142 &quot;sir&quot;. Jego przedstawienie tej postaci jest idealne i ten absurdalny ch\u0142\u00f3d.\nStevens to kamerdyner doskona\u0142y, profesjonalny, wr\u0119cz perfekcyjny, lojalny, ca\u0142kowicie oddany swojej pracy, dla niej potrafi po\u015bwi\u0119ci\u0107 wszystko, naprawd\u0119 wszystko , nie wy\u0142\u0105czaj\u0105c \u017cycia osobistego. Dzisiejszym jego odpowiednikiem by\u0142by chyba pracoholik.\nJednak ostateczny rozrachunek z \u017cyciem nie bilansuje si\u0119. Wychodzi na to, \u017ce zaprzepa\u015bci\u0142 w \u017cyciu co\u015b bardzo wa\u017cnego i straci\u0142 co\u015b cennego, pozosta\u0142a pustka i uczucie niespe\u0142nienia.\nDla wielbicieli Ishiguro i angielskich klimat\u00f3w pozycja obowi\u0105zkowa.","reviewRating":{"@type":"Rating","ratingValue":"8","bestRating":"10","worstRating":"1"}},{"@type":"Review","datePublished":"2016-09-16 10:37:37.173313","url":"https:\/\/lubimyczytac.pl\/ksiazka\/5249583\/okruchy-dnia#opinie","author":{"@type":"Person","name":"wiech","url":"https:\/\/lubimyczytac.pl\/profil\/307008\/wiech"},"reviewBody":"Okruchy dnia\u2026 Okruchy wspomnie\u0144.\n\nJak \u0142atwo mo\u017cna zast\u0105pi\u0107 prawdziwe \u017cycie prac\u0105 i nawet tego nie zauwa\u017cy\u0107. Ksi\u0105\u017cka mo\u017ce by\u0107 przestrog\u0105 dla tych, kt\u00f3rzy prac\u0119 stawiaj\u0105 ponad wszystko. By opami\u0119tanie nie przysz\u0142o za p\u00f3\u017ano.\nStara angielska posiad\u0142o\u015b\u0107, angielski klimat, angielski styl. I sztywny angielski kamerdyner. Dystyngowany, o nienagannych manierach. Irytuj\u0105co pow\u015bci\u0105gliwy w wyra\u017caniu emocji.\nLojalnie s\u0142u\u017cy swojemu panu. Bez reszty po\u015bwi\u0119ca si\u0119 pracy. To ona jest sensem jego \u017cycia. Innego \u017cycia nie zna. Nie dba o w\u0142asne potrzeby, o w\u0142asne szcz\u0119\u015bcie.\nU schy\u0142ku \u017cycia dostaje urlop. Odbywa sentymentaln\u0105 podr\u00f3\u017c. Tak\u017ce podr\u00f3\u017c do swojego wn\u0119trza, do wspomnie\u0144. Rozmy\u015bla nad tym, co bezpowrotnie straci\u0142. Szans\u0119 na szcz\u0119\u015bcie. A przecie\u017c m\u00f3g\u0142 \u017cy\u0107 inaczej. Za p\u00f3\u017ano. \u017bycie przesz\u0142o obok.\n\nWspania\u0142y klimat, wykwintny styl. Pi\u0119kna ksi\u0105\u017cka. Do powolnego czytania, delektowania si\u0119.","reviewRating":{"@type":"Rating","ratingValue":"8","bestRating":"10","worstRating":"1"}},{"@type":"Review","datePublished":"2019-11-09 11:49:25.161102","url":"https:\/\/lubimyczytac.pl\/ksiazka\/5249583\/okruchy-dnia#opinie","author":{"@type":"Person","name":"Jolanta","url":"https:\/\/lubimyczytac.pl\/profil\/597603\/jolanta"},"reviewBody":"Powie\u015b\u0107 na przemian bawi i wzrusza. Czytaj\u0105c j\u0105 by\u0142am troch\u0119 zniecierpliwiona postaw\u0105 Stevensa sumiennie wykonuj\u0105cego swoje obowi\u0105zki kamerdynera przez 34 lata w rezydencji Darlington Hall, w czasach przed II wojn\u0105 \u015bwiatow\u0105 i po wojnie. Lata mija\u0142y, a jego lojalno\u015b\u0107 i oddanie uczyni\u0142y z niego samotnika pozbawionego nami\u0119tno\u015bci. Dopiero podr\u00f3\u017c do by\u0142ej gospodyni, aby nam\u00f3wi\u0107 j\u0105 na powr\u00f3t do pracy do nowego zarz\u0105dcy, daje Stevensowi mo\u017cliwo\u015b\u0107 przemy\u015blenia swego dotychczasowego \u017cycia. T\u0119skni jednak za czasami wystawno\u015bci, wspomina z melancholi\u0105 \u015bwiat, kt\u00f3ry ju\u017c prawie przesta\u0142 istnie\u0107. Czytaj\u0105c t\u0119 ksi\u0105\u017ck\u0119 by\u0142am ciekawa, czy w ko\u0144cu &quot;obudz\u0105 si\u0119&quot; w nim jakie\u015b emocje i uczucia, czy odnajdzie si\u0119 we wsp\u00f3\u0142czesnym \u015bwiecie.\nTo powie\u015b\u0107 raczej do powolnego czytania, nie ma w niej w\u0142a\u015bciwie akcji i porywaj\u0105cych dialog\u00f3w. Mnie si\u0119 jednak podoba\u0142a, gdy\u017c autorowi uda\u0142o si\u0119 w spos\u00f3b sympatyczny pokaza\u0107 charakterystyczny \u015bwiat Brytyjczyk\u00f3w.","reviewRating":{"@type":"Rating","ratingValue":"9","bestRating":"10","worstRating":"1"}},{"@type":"Review","datePublished":"2022-09-13 23:48:07.362499","url":"https:\/\/lubimyczytac.pl\/ksiazka\/5249583\/okruchy-dnia#opinie","author":{"@type":"Person","name":"Ewa Kowalska","url":"https:\/\/lubimyczytac.pl\/profil\/415198\/ewa-kowalska"},"reviewBody":"Czy spotkali\u015bcie kiedy\u015b w restauracji nadmiernie dystynowanego kelnera, kt\u00f3ry sun\u0105\u0142 po sali z godno\u015bci\u0105, rozsiewaj\u0105c wok\u00f3\u0142 w\u0142asne prze\u015bwiadczenie, \u017ce klienci to plebs i mu do pi\u0119t nie dorastaj\u0105? \nJa spotka\u0142am wielokrotnie, a g\u0142\u00f3wny bohater powie\u015bci - kamerdyner Stevens to w\u0142a\u015bnie taki typ. Facet, kt\u00f3rego \u017cycie definiowa\u0142a praca, godno\u015b\u0107, duma i che\u0142pliwo\u015b\u0107. \u017by\u0142 spe\u0142niony, jako pracownik perfekcyjny, tak oddany pracodawcy, \u017ce widzia\u0142 w sobie tylko s\u0142u\u017c\u0105cego. Gorzej wypada\u0142 jako cz\u0142owiek, jako osoba prywatna. Wgl\u0105d w jego nudne, pozbawione mi\u0142o\u015bci, ostatecznie pe\u0142ne \u017calu \u017cycie, to tre\u015b\u0107 \u201eOkruch\u00f3w dnia\u201d. W powie\u015bci nie dzieje si\u0119 nic spektakularnego, nie ma \u017cadnych zwrot\u00f3w akcji, ba(!) nawet jakiejkolwiek akcji brakuje, ale to wcale nie przeszkadza. \n\nRazem ze Stevensem wyruszy\u0142am samochodem w podr\u00f3\u017c do odleg\u0142ej Kornwalii obserwuj\u0105c za oknem krajobrazy i s\u0142uchaj\u0105c opowie\u015bci o jego \u017cyciu.\nI tutaj stop, ani s\u0142owa wi\u0119cej o tre\u015bci, bo b\u0119dzie to ze szkod\u0105 dla lektury powie\u015bci, je\u015bli t\u0119 opini\u0119 czyta kto\u015b, kto nie zna ksi\u0105\u017cki lub filmu. \nPoza tym mam prze\u015bwiadczenie, \u017ce nie mnie wypowiada\u0107 si\u0119 o prozie Mistrza Ishiguro. On pisze, ja czytam i si\u0119 zachwycam:\n- m\u0105dro\u015bci\u0105 powie\u015bci i jej uniwersalno\u015bci\u0105. Szczeg\u00f3lnie dla pracoholik\u00f3w, ludzi chowaj\u0105cych si\u0119 za prac\u0105 oraz \u015blepo i bezkrytycznie lojalnych wobec pracodawc\u00f3w.\n- dywagacjami nad sensem cz\u0142owieczej egzystencji, \u017cyciow\u0105 misj\u0105, przemijaniem i utraconymi szansami.\n- j\u0119zykiem pow\u015bci\u0105gliwym, na miar\u0119 angielskiego kamerdynera. Wszystkie zdania s\u0105 tak dystyngowane, jakby we fraku i muszce. \n- specyficznym brytyjskim humorem i du\u017c\u0105 ilo\u015bci\u0105 zabawnych moment\u00f3w.\n\nW\u0142a\u015bciwie podoba\u0142o mi si\u0119 wszystko i ka\u017cda chwila z ksi\u0105\u017ck\u0105 sprawia\u0142a mi przyjemno\u015b\u0107, czego r\u00f3wnie\u017c Pa\u0144stwu \u017cycz\u0119. A kamerdyner Stevens? Mam nadziej\u0119, \u017ce si\u0119 pozbiera\u0142, ma z kim pi\u0107 kakao i nadal trenuje \u017carty.","reviewRating":{"@type":"Rating","ratingValue":"9","bestRating":"10","worstRating":"1"}},{"@type":"Review","datePublished":"2018-05-24 22:48:32.115991","url":"https:\/\/lubimyczytac.pl\/ksiazka\/5249583\/okruchy-dnia#opinie","author":{"@type":"Person","name":"jatymyoni","url":"https:\/\/lubimyczytac.pl\/profil\/180974\/jatymyoni"},"reviewBody":"Bardzo smakowita ksi\u0105\u017cka. Delektowa\u0142am si\u0119 j\u0119zykiem, nastrojem i opisami krajobrazu. \u015awietny portret psychologiczny, ale te\u017c opis stosunk\u00f3w panuj\u0105cych w \u201ewy\u017cszych sfera\u201d w Anglii przed wybuchem II wojny \u015bwiatowej. Stavens by\u0142 kamerdynerem u bardzo wp\u0142ywowego lorda i jest dumny z tego co robi i kim jest. To jest w nim pi\u0119kne i we wsp\u00f3\u0142czesnym \u015bwiecie coraz rzadsze. Niestety jego chlebodawca umiera i Stavens zaczyna pracowa\u0107 dla nowego w\u0142a\u015bciciela domu. Jego dotychczasowy \u015bwiat si\u0119 rozpada. Pod pretekstem spotkania z by\u0142\u0105 gospodyni\u0105 wyrusza na sze\u015bciodniow\u0105 wycieczk\u0119. Wyprawa ta jest swoist\u0105 spowiedzi\u0105, podsumowaniem ca\u0142ego dotychczasowego \u017cycia. Nic nie wiemy o matce Stavensa, natomiast jego ojciec by\u0142 te\u017c kamerdynerem. Mo\u017cna przypuszcza\u0107, \u017ce to on wpoi\u0142 mu zasady \u017cycia i pracy. Jad\u0105c i podziwiaj\u0105c angielski krajobraz zastanawia si\u0119 co to znaczy dla niego by\u0107 dobrym kamerdynerem i czy on tym narzuconym sobie idea\u0142om sprosta\u0142. Czy jednak ten sztywny gorset nie doprowadza do zaniku normalnych ludzkich odruch\u00f3w. Czy dla Sravensa istnieje co\u015b poza prac\u0105. My\u015bl\u0119, \u017ce i teraz znale\u017aliby\u015bmy ludzi, kt\u00f3rzy wy\u0142\u0105cznie i ca\u0142kowicie identyfikuj\u0105 si\u0119 ze swoj\u0105 prac\u0105. A co wtedy trac\u0105? Czy mo\u017cna zablokowa\u0107 w\u0142asne uczucia i my\u015bli, aby \u015bwiat nigdy si\u0119 o nich nie dowiedzia\u0142? Czy nie spotykamy ludzi, kt\u00f3rzy si\u0119 tak identyfikuj\u0105 z kim\u015b lub z jak\u0105\u015b ide\u0105, \u017ce zatracaj\u0105 swoje w\u0142asne pogl\u0105dy i uczucia. Ile we mnie jest z kamerdynera? Jest to gorzka opowie\u015b\u0107 o \u017cyciu, o jego sensie i celu. Jest to m\u0105dra ksi\u0105\u017cka i w swym wymiarze psychologicznym ponadczasowa.\nWarto t\u0105 ksi\u0105\u017ck\u0119 przeczyta\u0107 i przemy\u015ble\u0107.","reviewRating":{"@type":"Rating","ratingValue":"9","bestRating":"10","worstRating":"1"}},{"@type":"Review","datePublished":"2018-03-30 19:22:25.956352","url":"https:\/\/lubimyczytac.pl\/ksiazka\/5249583\/okruchy-dnia#opinie","author":{"@type":"Person","name":"Voldemort","url":"https:\/\/lubimyczytac.pl\/profil\/391811\/voldemort"},"reviewBody":"Literacka Nagroda Nobla przyznana Kazuo Ishiguro w 2017 roku sk\u0142oni\u0142a mnie do si\u0119gni\u0119cia po t\u0119 wybitn\u0105 ksi\u0105\u017ck\u0119, o kt\u00f3rej s\u0142ysza\u0142em ju\u017c wcze\u015bniej, ale nie by\u0142a ona priorytetem w mojej kolejce do przeczytania. Ogl\u0105da\u0142em wiele lat temu jej ekranizacj\u0119 i dla mnie kamerdyner Stevens i panna Kenton na zawsze ju\u017c b\u0119d\u0105 mieli twarze Anthony'ego Hopkinsa i Emmy Thompson. \n\nA\u017c trudno uwierzy\u0107, \u017ce ksi\u0105\u017cka ta wysz\u0142a spod pi\u00f3ra pisarza pochodz\u0105cego z Japonii - a to przez jej uderzaj\u0105c\u0105 wr\u0119cz brytyjsko\u015b\u0107 j\u0119zyka (chocia\u017c czyta\u0142em polskie t\u0142umaczenie, nota bene bardzo udane),narracji i wykreowanych bohater\u00f3w. Stevens jest wr\u0119cz &quot;archetypowym&quot; angielskim kamerdynerem, o ile taki archetyp m\u00f3g\u0142by istnie\u0107. Jest to kamerdyner doskona\u0142y, ca\u0142kowicie oddany swej s\u0142u\u017cbie, bezgranicznie lojalny... i zdaj\u0105cy si\u0119 nie wiedzie\u0107, \u017ce istnieje co\u015b takiego jak \u017cycie osobiste. \n\nIshiguro jest prawdziwym mistrzem nastroju, niuans\u00f3w i niedopowiedze\u0144 bardziej wymownych ni\u017c to, co zosta\u0142o powiedziane. I za to m.in. daj\u0119 maksymaln\u0105 ocen\u0119, chocia\u017c waha\u0142em si\u0119 czy pewne d\u0142u\u017cyzny (nie takie znowu uci\u0105\u017cliwe) nie psu\u0142y mi odbioru tej ksi\u0105\u017cki i chcia\u0142em przez to wystawi\u0107 9\/10. Po d\u0142u\u017cszym zastanowieniu jednak max. Kto nie czyta\u0142, a lubi angielskie klimaty, to jest to lektura obowi\u0105zkowa. Gor\u0105co polecam!","reviewRating":{"@type":"Rating","ratingValue":"10","bestRating":"10","worstRating":"1"}},{"@type":"Review","datePublished":"2019-04-29 14:08:41.303409","url":"https:\/\/lubimyczytac.pl\/ksiazka\/5249583\/okruchy-dnia#opinie","author":{"@type":"Person","name":"Ksychopata","url":"https:\/\/lubimyczytac.pl\/profil\/302902\/ksychopata"},"reviewBody":"Jakbym przeni\u00f3s\u0142 si\u0119 w klimat i aran\u017cacj\u0119 powie\u015bci Daphne De Maurier &quot;REBEKA&quot;.\nTak si\u0119 w\u0142a\u015bnie czu\u0142em zaczynaj\u0105c literack\u0105 przygod\u0119 z t\u0105 ksi\u0105\u017ck\u0105...\n\nUwielbiam ksi\u0105\u017cki prowadzone tak\u0105 w\u0142a\u015bnie narracj\u0105. Dobrze si\u0119 w nich odnajduj\u0119, bo sprawiaj\u0105 wra\u017cenie, jakbym wnikn\u0105 w \u015bwiat czyjej\u015b osoby. Niby ka\u017cda ksi\u0105\u017cka to potrafi, ale taka pierwszoosobowa narracja pozwala mi wnikn\u0105\u0107 najbardziej w czelu\u015b\u0107 fabu\u0142y i psychiki postaci. Odrywam si\u0119 my\u015blami od normalnej, bie\u017c\u0105cej rzeczywisto\u015bci...\n\nKunszt jako\u015bci s\u0142owa na najwy\u017cszym literackim poziomie. To czysta przyjemno\u015b\u0107 smakowa\u0107 takie pi\u0119kno s\u0142\u00f3w, przemy\u015ble\u0144 odno\u015bnie \u017cycia, przemijania i sensu ca\u0142ej ludzkiej egzystencji...\nTo jest tego rodzaju ksi\u0105\u017cka, kt\u00f3rej g\u0142\u0119bia ca\u0142o\u015bci, pocz\u0105wszy od przemy\u015ble\u0144, przes\u0142ania, g\u0142\u00f3wneg nurtu, sko\u0144czywszy na emocjach w niej zawartych, przyt\u0142acza sw\u0105 wielko\u015bci\u0105 wszystkie zwyczajne obyczaj\u00f3wki pisane, troch\u0119 jakby na kolanie, wydawane z cz\u0119stotliwo\u015bci roku kalendarzowego albo nawet i cz\u0119\u015bciej...\n\nApropos wielko\u015bci...\nCa\u0142a ta ksi\u0105\u017cka jest pe\u0142na fragment\u00f3w godnych zawarcia i zamkni\u0119cia ich w cytacie...\nJeden szczeg\u00f3lny fragment o &quot;WIELKO\u015aCI&quot; wzbudzi\u0142 moje wielkie uznanie. Odnosi si\u0119 bowiem nie tylko do omawianej kwestii, ale do - mo\u017cna powiedzie\u0107 - wszystkich innych zwi\u0105znych z naszym byciem, tu na ziemskim padole...\n***\n***\n&quot;Czym\u017ce jest jednak ta &quot;wielko\u015b\u0107&quot;? Na czym\u017ce polega, z czego wynika? Doskonale zdaj\u0119 sobie spraw\u0119, \u017ce odpowiedzi na takie pytanie nale\u017ca\u0142oby szuka\u0107 w m\u0119drszej ni\u017c moja g\u0142owa; gdybym jednak mia\u0142 zaryzykowa\u0107 w\u0142asne zdanie, powiedzia\u0142bym, \u017ce pi\u0119kno naszego kraju jest niepowtarzalne w\u0142a\u015bnie dzi\u0119ki nieistnieniu w nim powierzchownej spektakularno\u015bci. Wielko\u015bci\u0105 tego pi\u0119kna jest jego spok\u00f3j, jego poczucie umiaru; tak jakby kraj ten wiedzia\u0142 o swym pi\u0119knie, o swej wielko\u015bci i nie czu\u0142 potrzeby g\u0142o\u015bnego o tym oznajmiania. W por\u00f3wnaniu z nim widoki, kt\u00f3re mo\u017cna znale\u017a\u0107 w jakiej\u015b tam Afryce czy Ameryce, cho\u0107 z pewno\u015bci\u0105 bardzo podniecaj\u0105ce, dla obiektywnego obserwatora b\u0119d\u0105 bez w\u0105tpienia mniej cenne z powodu swej zbytniej ostentacji.&quot;\n( str. 36 )\n***\n***\n\nNie m\u00f3g\u0142bym pomin\u0105\u0107 kwestii wytwornego stylu tej powie\u015bci. Nie by\u0142oby w tym nic dziwnego, gdyb autorem nie by\u0142a osoba pochodzenia japo\u0144skiego. \nKazuo Ishiguro napisa\u0142 t\u0119 powie\u015b\u0107 niczym rodowity Anglik, ze znamienit\u0105 w ich dialogach i prozie elegancj\u0105, szalechetno\u015bci\u0105. Jakby te wszystkie zdania rze\u017abi\u0105ce powie\u015b\u0107 ubra\u0107 we frak, b\u0105d\u017a najwykwintniejsz\u0105 z dworskich sukien. Nie wiem, czy to por\u00f3wnanie dobrze oddaje ducha angielskiego pisarstwa, ale takie w\u0142a\u015bnie przysz\u0142o mi do g\u0142owy...\nGdyby czyta\u0107 jednocze\u015bnie powie\u015b\u0107 Henrego Jamesa i Kazuo Ishiguro, czytelnik nie by\u0142by w stanie dostrzec \u017cadnej r\u00f3\u017cnicy...\n...\nJakby nie by\u0142o, Kazou Ishiguro mimo swojego pochodzenia sta\u0142 si\u0119 Anglikiem na potrzeby tej\u017ce powie\u015bci...\n...\nMy\u015bl\u0119, \u017ce nie zaskocz\u0119 samego siebie, je\u015bli w nied\u0142ugim czasie z wielk\u0105 przyjemno\u015bci\u0105 si\u0119gn\u0119 po inn\u0105 jego ksi\u0105\u017ck\u0119.\nJe\u015bli oczywi\u015bcie zdrowie, czas i B\u00f3g mi na to pozwoli...\n\nCzyta si\u0119 j\u0105 jednym duszkiem... Rozdzia\u0142y s\u0105 do\u015b\u0107 d\u0142ugie, wi\u0119c dzielenie jej na kr\u00f3tkie fragmenty sprawi, \u017ce g\u0142\u0119bia naszego odbioru tej powie\u015bci b\u0119dzie strasznie poszarpana. \nTa ksi\u0105\u017cka wymaga ciszy, spokoju i komfortu wolnego czasu. Trzeba zakopa\u0107 si\u0119 w k\u0105cie swoich czterech \u015bcian, zapomnie\u0107 o swojej rzeczywisto\u015bci.\nW\u00f3wczas jej odbi\u00f3r w spos\u00f3b ca\u0142kowity i niezwykle intensywny odci\u015bnie si\u0119 na naszej \u015bwiadomo\u015bci, karmi\u0105c j\u0105 ca\u0142ym mn\u00f3stwem przemy\u015ble\u0144 autora, kt\u00f3re nada\u0142y tej historii skrystalizowany kszta\u0142t.\nNale\u017cy si\u0119gn\u0105\u0107 po t\u0119 ksi\u0105\u017ck\u0119, wtedy gdy nic problematycznego nie zaprz\u0105ta naszej g\u0142owy i mamy troch\u0119 wolnego czasu na wype\u0142nienie go lektur\u0105 ksi\u0105\u017cki. \nTo jest tylko sugestia. Ka\u017cdy zrobi po swojemu...","reviewRating":{"@type":"Rating","ratingValue":"9","bestRating":"10","worstRating":"1"}},{"@type":"Review","datePublished":"2018-09-11 13:17:25.393153","url":"https:\/\/lubimyczytac.pl\/ksiazka\/5249583\/okruchy-dnia#opinie","author":{"@type":"Person","name":"Nata","url":"https:\/\/lubimyczytac.pl\/profil\/1862122\/nata"},"reviewBody":"Nie dzieje si\u0119 nic spektakularnego, nie ma po\u015bcig\u00f3w, gwa\u0142t\u00f3w \u2026 opowie\u015b\u0107 p\u0142ynie leniwie, spokojnie, wszystko jest takie harmonijne, jasne i proste, mo\u017ce troch\u0119 smutne.\n\nAkcja toczy si\u0119 w Anglii. Starszy pan Stevens snuje swoj\u0105 opowie\u015b\u0107 o \u017cyciu, o tym co jest dla niego najwa\u017cniejsze czyli przede wszystkim o swoim zawodzie, kt\u00f3ry wykonuje z pasji, powo\u0142ania, obowi\u0105zku, kt\u00f3ry przeszed\u0142 z ojca na syna. Opowiada o godno\u015bci w jego zawodzie, wspomina jak by\u0142o kiedy\u015b a jak jest teraz\u2026 A jest tylko lub a\u017c kamerdynerem.\n\nZadziwiaj\u0105ce jest wed\u0142ug mnie to, \u017ce pomimo braku wartkiej akcji, ekscytuj\u0105cych zwrot\u00f3w i niesamowitych przyg\u00f3d ta ksi\u0105\u017cka wcale nie nudzi. Z ogromn\u0105 przyjemno\u015bci\u0105 i zainteresowaniem zag\u0142\u0119bia\u0142am si\u0119 we wspomnienia Stevensona i ogl\u0105da\u0142am \u015bwiat jego oczami, ciekawa jego przemy\u015ble\u0144. Po szczeg\u00f3lnie ci\u0119\u017ckim i stresuj\u0105cym dniu ta opowie\u015b\u0107 by\u0142a moim remedium na \u201ez\u0142o\u201d otaczaj\u0105cego \u015bwiata, balsamem na moja dusz\u0119\u2026 Nie wiem jak wypad\u0142a ekranizacja z Anthonym Hopkinsem i Emm\u0105 Thompson, wyr\u00f3\u017cniona 8 nominacjami do Oscara, bo jej nie widzia\u0142am \u2013 pewnie nie\u017ale (a to znaczy, \u017ce chyba nie tylko mi si\u0119 ona podoba\u0142a) ale taki lek jak ta ksi\u0105\u017cka warto mie\u0107 pod r\u0119k\u0105, w szczeg\u00f3lno\u015bci w autobusie\u2026","reviewRating":{"@type":"Rating","ratingValue":"7","bestRating":"10","worstRating":"1"}},{"@type":"Review","datePublished":"2015-09-28 08:16:39.646832","url":"https:\/\/lubimyczytac.pl\/ksiazka\/5249583\/okruchy-dnia#opinie","author":{"@type":"Person","name":"Mako","url":"https:\/\/lubimyczytac.pl\/profil\/255187\/mako"},"reviewBody":"Genialna ksi\u0105\u017cka. Wspania\u0142e prowadzenie narracji z perspektywy angielskiego kamerdynera, ograniczonego pojmowaniem swojej roli, pozbawionego kontaktu ze swoimi emocjami. Ju\u017c sam prolog to mistrzostwo, gdzie z pozornie nudnej i niewiele wnosz\u0105cej ekspozycji, otrzymujemy posta\u0107 bohatera z krwi i ko\u015bci, prawdziwego cz\u0142owieka, ze wszystkimi zaletami i u\u0142omno\u015bciami. J\u0119zyk narratora, jego wybory, zachowania i dialogi: wszystko zosta\u0142o idealnie wymierzone i odmalowane. Podczas kilkudniowej wycieczki samochodowej, Stevens wraca pami\u0119ci\u0105 do kilku wydarze\u0144 z przesz\u0142o\u015bci. Powracaj\u0105 one pod wp\u0142ywem drobnych incydent\u00f3w w trakcie podr\u00f3\u017cy. Wszystko zdaje si\u0119 by\u0107 pozornie nieistotne, przywo\u0142ane okruchy pami\u0119ci, jednak nic tu nie zosta\u0142o pozbawione znaczenia. Ka\u017cda scena, ka\u017cde zdanie tworz\u0105 posta\u0107 po cz\u0119\u015bci komiczn\u0105, ale i po cz\u0119\u015bci tragiczn\u0105.\nChocia\u017c film, kt\u00f3ry powsta\u0142 na podstawie tej ksi\u0105\u017cki, ogl\u0105da\u0142am wiele lat temu, nie potrafi\u0142am nie widzie\u0107 Anthony'ego Hopkinsa w genialnie zagranej roli Stevensa.\nKsi\u0105\u017cka bardzo angielska w najlepszym tego s\u0142owa sensie. Pi\u0119kna! Polecam bardzo","reviewRating":{"@type":"Rating","ratingValue":"10","bestRating":"10","worstRating":"1"}},{"@type":"Review","datePublished":"2019-12-04 14:28:37.888751","url":"https:\/\/lubimyczytac.pl\/ksiazka\/5249583\/okruchy-dnia#opinie","author":{"@type":"Person","name":"beata","url":"https:\/\/lubimyczytac.pl\/profil\/546077\/beata"},"reviewBody":"Elegancja, wielop\u0142aszczyznowo\u015b\u0107, niuanse. Moim zdaniem to s\u0142owa kluczowe okre\u015blaj\u0105ce \u201eOkruchy dnia\u201d. I ca\u0142a gama rozwa\u017ca\u0144 dotycz\u0105cych lojalno\u015bci, s\u0142u\u017cby, konsekwencji, priorytet\u00f3w, \u017cycia dla idei, \u017cycia w bezwarunkowej zgodzie z okre\u015blonymi przez kogo\u015b zasadami, bez poddawania w w\u0105tpliwo\u015b\u0107, bez poszukiwania, bez brania odpowiedzialno\u015bci za dokonywane wybory\u2026 I powracaj\u0105ce natr\u0119tnie, podczas ca\u0142ej lektury, s\u0142owa dawnego przeboju Lombardu: \u201ePrze\u017cyj to sam\u201d.\n\nNarratorem opowie\u015bci jest Stevens, angielski kamerdyner, d\u0105\u017c\u0105cy do osi\u0105gni\u0119cia idea\u0142u w wykonywaniu zawodu. Poznajemy go podczas sze\u015bciodniowej wycieczki, kt\u00f3rej cel oraz mijane angielskie krajobrazy uruchamiaj\u0105 lawin\u0119 jego wspomnie\u0144. Wspomnienia Stevensa Ishiguro poda\u0142 nam w formie intryguj\u0105cej opowie\u015bci, w kt\u00f3rej s\u0142owa, niedom\u00f3wienia i milczenie stworzy\u0142y mistrzowsk\u0105 mieszank\u0119 uruchamiaj\u0105c\u0105 emocje i intelekt czytelnika. \n\n\u201eOkruchy dnia\u201d to prawdziwa czytelnicza przyjemno\u015b\u0107 delektowania si\u0119 kunsztem i pi\u0119knem s\u0142\u00f3w, uczestniczenia w przemy\u015bleniach narratora i snucia w\u0142asnych refleksji. \n\nPolecam.","reviewRating":{"@type":"Rating","ratingValue":"8","bestRating":"10","worstRating":"1"}},{"@type":"Review","datePublished":"2024-12-14 12:27:45.657845","url":"https:\/\/lubimyczytac.pl\/ksiazka\/5249583\/okruchy-dnia#opinie","author":{"@type":"Person","name":"Pshemo","url":"https:\/\/lubimyczytac.pl\/profil\/460181\/pshemo"},"reviewBody":"Pi\u0119kna opowie\u015b\u0107, pokazuj\u0105ca, \u017ce najbardziej przejmuj\u0105ce, emocjonalne i anga\u017cuj\u0105ce historie nie musz\u0105 odpowiada\u0107 o donios\u0142ych i epickich wydarzeniach, ale mog\u0105 dotyczy\u0107 tzw. &quot;prostego \u017cycia&quot; i zwyczajnej codzienno\u015bci.\n\nTo powie\u015b\u0107 o kulturze pracy, odpowiedzialno\u015bci \u017cyciowej, ale i o mi\u0142o\u015bci, cho\u0107 nie wypowiedzianej wprost.","reviewRating":{"@type":"Rating","ratingValue":"7","bestRating":"10","worstRating":"1"}},{"@type":"Review","datePublished":"2021-09-05 17:51:45.180293","url":"https:\/\/lubimyczytac.pl\/ksiazka\/5249583\/okruchy-dnia#opinie","author":{"@type":"Person","name":"Zena","url":"https:\/\/lubimyczytac.pl\/profil\/2180319\/zena"},"reviewBody":"Okruchy wspomnie\u0144 angielskiego kamerdynera. Akurat ogl\u0105dam Dowton Abbey, wi\u0119c jestem w klimacie epoki. Jednak temat jest znacznie powa\u017cniejszy ni\u017c akcja s\u0142ynnego serialu BBC. Podsumowanie \u017cycie cz\u0142owieka, kt\u00f3ry w my\u015bl zachowania &quot;godno\u015bci&quot; kamerdynera prowadzi\u0142 \u017cycie wype\u0142nione obowi\u0105zkami ale bez refleksji i ostatecznie przegapi\u0142 swoje szcz\u0119\u015bcie.","reviewRating":{"@type":"Rating","ratingValue":"8","bestRating":"10","worstRating":"1"}},{"@type":"Review","datePublished":"2021-10-17 22:10:41.033475","url":"https:\/\/lubimyczytac.pl\/ksiazka\/5249583\/okruchy-dnia#opinie","author":{"@type":"Person","name":"Izabela","url":"https:\/\/lubimyczytac.pl\/profil\/7867\/izabela"},"reviewBody":"Dlaczego mam wra\u017cenie, \u017ce ta pozycja jest i\u015bcie brytyjska? Nie tylko ze wzgl\u0119du na miejsce w jakiej jest przytoczona akcja (Anglia),ale r\u00f3wnie\u017c ze wzgl\u0119du na pow\u015bci\u0105gliwo\u015b\u0107 emocjonaln\u0105 g\u0142\u00f3wnego bohatera i jego wieczne d\u0105\u017cenie do &quot;bycia godnym&quot;. Godnym czego? Bycia dobrym kamerdynerem, kt\u00f3ry jak cie\u0144 pod\u0105\u017ca za potrzebami domu, w kt\u00f3rym pracuje. Oddanym pracownikiem, kt\u00f3ry nigdy nie m\u00f3wi \u017ale o swoim pracodawcy, a je\u017celi s\u0105 przes\u0142anki do tego, \u017ce pan nie by\u0142 zbyt dobrym cz\u0142owiekiem- okazuje \u015bwiatu, \u017ce nie wie o kogo chodzi. \nAutor przedstawia nam pana Stevensa- kamerdynera, kt\u00f3ry zdaje si\u0119 lata \u015bwietlno\u015bci w swoim fachu ma ju\u017c za sob\u0105, ale sam przed sob\u0105 troch\u0119 nie chce si\u0119 do tego przyzna\u0107. \nPodczas w\u0119dr\u00f3wki po Anglii, kt\u00f3ra, jak sam cz\u0119sto podkre\u015bla, ma charakter w du\u017cej mierze s\u0142u\u017cbowy, du\u017co rozpami\u0119tuje swoj\u0105 przesz\u0142o\u015b\u0107 i okazuje si\u0119, \u017ce tylko niekt\u00f3re wydarzenia ze swojego \u017cycia, mo\u017ce nazwa\u0107 godnymi istnienia. Wydaje mi si\u0119, \u017ce to w\u0142a\u015bnie tytu\u0142owe okruchy dnia, kt\u00f3re pod koniec pewnego etapu naszego \u017cycia , definiuj\u0105 to kim jeste\u015bmy.\n\nWpis zamieszczam w ramach wyzwania czytelniczego WyPo\u017cyczone.\nhttp:\/\/www.rudymspojrzeniem.pl\/2020\/12\/wyzwanie-czytelnicze-wypozyczone-2021.html","reviewRating":{"@type":"Rating","ratingValue":"7","bestRating":"10","worstRating":"1"}},{"@type":"Review","datePublished":"2017-11-30 13:19:02.260957","url":"https:\/\/lubimyczytac.pl\/ksiazka\/5249583\/okruchy-dnia#opinie","author":{"@type":"Person","name":"Je\u017cynka","url":"https:\/\/lubimyczytac.pl\/profil\/568709\/jezynka"},"reviewBody":"Pewnie gdyby nie Nagroda Nobla dla Kazuo Ishiguro nie si\u0119gn\u0119\u0142abym po t\u0119 ksi\u0105\u017ck\u0119. Nie darz\u0119 literatury brytyjskiej jakim\u015b szczeg\u00f3lnym sentymentem. Autor, mimo i\u017c jest z pochodzenia Japo\u0144czykiem na Wyspach wychowywa\u0142 si\u0119 od wczesnego dzieci\u0144stwa i przynajmniej w &quot;Okruchach dnia&quot; jego egzotyczne pochodzenie nie dochodzi do g\u0142osu, bo zar\u00f3wno historia jak\u0105 opowiada jak i jej bohaterowie s\u0105 na wskro\u015b angielscy.\n\nNarratorem opowie\u015bci jest angielski kamerdyner, kt\u00f3ry ca\u0142e swoje \u017cycie po\u015bwi\u0119ci\u0142 s\u0142u\u017cbie. Jego oddanie pracodawcy i perfekcja w wykonywaniu obowi\u0105zk\u00f3w s\u0105 dla Stevensa powodami do dumy i osobistej satysfakcji. D\u0105\u017cenie do statusu doskona\u0142ego kamerdynera jest dla niego istot\u0105 egzystencji. Po \u015bmierci swego pracodawcy otrzymuje od nowego w\u0142a\u015bciciela rezydencji propozycj\u0119 aby dalej pe\u0142ni\u0107 swoj\u0105 funkcj\u0119. Jednak zmniejszenie liczby pracownik\u00f3w powoduje, i\u017c trudno utrzyma\u0107 posiad\u0142o\u015b\u0107 w idealnym stanie. Dlatego te\u017c kilka dniu urlopu kt\u00f3re otrzymuje postanawia po\u015bwi\u0119ci\u0107 na przekonanie do powrotu dawnej gospodyni kt\u00f3ra 20 lat zdecydowa\u0142a si\u0119 opu\u015bci\u0107 rezydencj\u0119 i wyj\u015b\u0107 za m\u0105\u017c.\nList kt\u00f3ry otrzymuje od niej Stevens ka\u017ce mu przypuszcza\u0107 i\u017c mo\u017ce by\u0107 ona zainteresowana powrotem.\nDla kamerdynera ta podr\u00f3\u017c jest pretekstem do podsumowania swojego dotychczasowego \u017cycia, podporz\u0105dkowanego jedynie pracy i perfekcyjnemu wykonywaniu swoich obowi\u0105zk\u00f3w gdzie nigdy nie by\u0142o w nim miejsca na uczucia, rozrywki, bliskie wi\u0119zi.\n\nAutor w &quot;Okruchach dnia&quot; stawia fundamentalne pytanie: Co jest w \u017cyciu najwa\u017cniejsze?, Jak \u017cy\u0107 aby mie\u0107 poczucie spe\u0142nienia i satysfakcji? Jakich wybor\u00f3w dokonywa\u0107 aby potem niczego nie \u017ca\u0142owa\u0107?\nG\u0142\u00f3wny bohater to cz\u0142owiek minionej epoki, nie umiej\u0105cy odnale\u017a\u0107 si\u0119 w nowej rzeczywisto\u015bci. Praca jest dla niego tarcz\u0105 i schronieniem przed \u017cyciem, kt\u00f3rego nie rozumie. To jedyna rzecz sta\u0142a w jego egzystencji i dzi\u0119ki kt\u00f3rej mo\u017ce czu\u0107 si\u0119 spe\u0142niony.\n\n&quot;Okruchy dnia&quot; to s\u0142odko-gorzka opowie\u015b\u0107 o \u017cyciu. Czasami wywo\u0142uj\u0105ca u\u015bmiech jednak cz\u0119\u015bciej zmuszaj\u0105ca do refleksji. Nastrojowa, poruszaj\u0105ca, do b\u00f3lu prawdziwa. Polecam.","reviewRating":{"@type":"Rating","ratingValue":"7","bestRating":"10","worstRating":"1"}},{"@type":"Review","datePublished":"2023-05-23 14:07:24.205461","url":"https:\/\/lubimyczytac.pl\/ksiazka\/5249583\/okruchy-dnia#opinie","author":{"@type":"Person","name":"Ushikawa","url":"https:\/\/lubimyczytac.pl\/profil\/1930889\/ushikawa"},"reviewBody":"Pomimo tego, \u017ce w powie\u015bci nie ma o tym ani s\u0142owa, mam nieodparte wra\u017cenie, \u017ce starzej\u0105cy si\u0119 oddany ca\u0142\u0105 dusza swemu Panu s\u0142uga, doskonale wpisuje si\u0119 w japo\u0144sk\u0105 tradycj\u0119 kodeksu Bushido. Autor znaj\u0105cy zar\u00f3wno tradycj\u0119 japo\u0144ska jak i histori\u0119 edwardia\u0144skiej Wielkiej Brytanii, wysy\u0142a w sentymentaln\u0105 podr\u00f3\u017c sztywnego jak kij od szczotki kamerdynera, ka\u017c\u0105c mu podsumowa\u0107 swe \u017cycie oddane bez reszty w s\u0142u\u017cb\u0119, zarozumia\u0142emu brytyjskiemu po\u017cytecznemu idiocie Hitlera. Cz\u0142owieka, kt\u00f3ry na koniec zdaje sobie spraw\u0119, \u017ce \u017cy\u0142 \u017cyciem innych, deprecjonuj\u0105c w\u0142asne. Ot przestroga taka.","reviewRating":{"@type":"Rating","ratingValue":"9","bestRating":"10","worstRating":"1"}},{"@type":"Review","datePublished":"2021-05-25 19:21:17.145391","url":"https:\/\/lubimyczytac.pl\/ksiazka\/5249583\/okruchy-dnia#opinie","author":{"@type":"Person","name":"ucho_igielne","url":"https:\/\/lubimyczytac.pl\/profil\/167379\/ucho-igielne"},"reviewBody":"Okruchy dnia to przepi\u0119kna opowie\u015b\u0107 o pracy kamerdynera a tak\u017ce o wszystkich z ni\u0105 zwi\u0105zanych emocjach, rozterkach, sukcesach i rozczarowaniach. Pokazuje, \u017ce praca to warto\u015b\u0107 sama w sobie i trudno j\u0105 tak naprawd\u0119 przeceni\u0107. Dla Stevensa stanowi ona ca\u0142y \u015bwiat i sens \u017cycia wi\u0119c mo\u017cna \u015bmia\u0142o powiedzie\u0107, \u017ce bez niej g\u0142\u00f3wnego bohatera w og\u00f3le by nie by\u0142o. Jednak praca to nie wszystko i Stevens po wielu latach bole\u015bnie si\u0119 o tym przekona. Czy da sobie szans\u0119 na mi\u0142o\u015b\u0107 albo przyja\u017a\u0144 czy mo\u017ce jest ju\u017c za p\u00f3\u017ano?\nBardzo ciekawa i niezwykle plastyczna proza, kt\u00f3ra operuje obrazami znajduj\u0105cymi odbicie w wyobra\u017ani czytelnika co sprawia, \u017ce czyta si\u0119 j\u0105 jakby ogl\u0105da\u0142o si\u0119 fascynuj\u0105cy film. Mo\u017ce nie jest w moim odczuciu jakim\u015b wybitnym arcydzie\u0142em ale za to frapuj\u0105ca bogactwem podejmowanych temat\u00f3w. Ksi\u0105\u017cka jest kr\u00f3ciutka ale za to szalenie efektowna i zapadaj\u0105ca g\u0142\u0119boko w pami\u0119\u0107. To ju\u017c moja druga powie\u015b\u0107 Kazuo Ishiguro a my\u015bl\u0119, \u017ce po tak udanym czytaniu b\u0119d\u0105 i nast\u0119pne. Polecam. Siedem gwiazdek (bardzo dobra)","reviewRating":{"@type":"Rating","ratingValue":"7","bestRating":"10","worstRating":"1"}},{"@type":"Review","datePublished":"2018-11-05 19:18:43.732366","url":"https:\/\/lubimyczytac.pl\/ksiazka\/5249583\/okruchy-dnia#opinie","author":{"@type":"Person","name":"Queequeg","url":"https:\/\/lubimyczytac.pl\/profil\/200756\/queequeg"},"reviewBody":"Do si\u0119gni\u0119cia po t\u0119 ksi\u0105\u017ck\u0119 sk\u0142oni\u0142 mnie film. Mam zamiar bowiem obejrze\u0107 adaptacj\u0119 \u201eOkruch\u00f3w dnia\u201d a zawsze najpierw si\u0119gam po literacki pierwowz\u00f3r. Niczego si\u0119 po tej ksi\u0105\u017cce nie spodziewa\u0142em ani niczego nie zak\u0142ada\u0142em, o autorze poza tym, \u017ce jest laureatem Nobla nie wiedzia\u0142em nic. Dlatego tym ch\u0119tniej zabra\u0142em si\u0119 za lektur\u0119 i nie \u017ca\u0142uj\u0119.\n\nCiekawa historia acz gorzka, pe\u0142na melancholii i nostalgicznych przemy\u015ble\u0144 o minionym \u017cyciu. Historia ta to swoiste podsumowanie \u017cycia Stevensa, narratora tej powie\u015bci, angielskiego kamerdynera , kt\u00f3ry przy okazji prywatnej wycieczki snuje wspomnienia i rozlicza si\u0119 sam ze sob\u0105 ze swojego \u017cycia. Prowadzi swoisty rozrachunek, o tym jak potoczy\u0142o si\u0119 jego \u017cycie, o tym co straci\u0142 bezpowrotnie, o zmarnowanych szansach. W wyniku tego rozrachunku wychodzi na to, \u017ce \u017cycie przeciek\u0142o mu przez palce, bo bez reszty po\u015bwi\u0119ci\u0142 siebie pracy i obowi\u0105zkom. Wnioski te s\u0105 smutne ale szcz\u0119\u015bliwie daleko im od przesadnego dramatyzmu.\n\nKsi\u0105\u017cka jest leniwa, nie\u015bpieszna, powolna. Nie ma w niej akcji pe\u0142nej napi\u0119cia. A mimo to czyta si\u0119 to naprawd\u0119 \u015bwietnie g\u0142\u00f3wnie z powodu tego jak rewelacyjnie Ishiguro skonstruowa\u0142 posta\u0107 Stevensa. \u0141atwo by\u0142o popa\u015b\u0107 w bana\u0142 przy tego typu historii na szcz\u0119\u015bcie autor unikn\u0105\u0142 pretensjonalno\u015bci i patosu a zamiast tego zachwyca bardzo ciekawym stylem i plastycznym j\u0119zykiem. \n\nKsi\u0105\u017cka poprzez posta\u0107 bohatera nasuwa mi pewne skojarzenia z genialnym serialem \u201eDownton Abbey\u201d i r\u00f3wnie genialnym filmem \u201eGosford Park\u201d. Mam te\u017c takie wra\u017cenie, \u017ce tw\u00f3rcy tego pierwszego czerpali pe\u0142nymi gar\u015bciami z postaci Stevensa tworz\u0105c posta\u0107 kamerdynera Carsona. Ale nic dziwnego \u2013 wszak to idealny materia\u0142 nie na jedn\u0105 a na kilka pe\u0142nokrwistych postaci. \n\nKsi\u0105\u017ck\u0119 rzecz jasna polecam bardzo.","reviewRating":{"@type":"Rating","ratingValue":"8","bestRating":"10","worstRating":"1"}},{"@type":"Review","datePublished":"2018-01-06 14:25:41.08323","url":"https:\/\/lubimyczytac.pl\/ksiazka\/5249583\/okruchy-dnia#opinie","author":{"@type":"Person","name":"El\u017cbieta","url":"https:\/\/lubimyczytac.pl\/profil\/309704\/elzbieta"},"reviewBody":"Doskonale napisana ksi\u0105\u017cka. Wszystko jest w niej idealne, zar\u00f3wno narracja jak tre\u015b\u0107 i wykreowany angielski klimat Nie ma tu \u017cadnych zb\u0119dnych opis\u00f3w,\u017cadnych udziwnie\u0144 na kt\u00f3re tak sil\u0105 si\u0119 teraz wszyscy wsp\u00f3\u0142cze\u015bni pisarze, \u017ceby przyci\u0105gn\u0105\u0107 czytelnika. W\u0142a\u015bnie po tym teraz poznaje si\u0119 klas\u0119 pisarza. Trzeba by\u0107 tak genialnym pisarzem,jak tegoroczny noblista,maj\u0105cym co\u015b do przekazania czytelnikowi, \u017ceby go prowadzi\u0107 przez spokojn\u0105, prawie leniw\u0105 akcj\u0119 ksi\u0105\u017cki i nie zanudzi\u0107,a zafascynowa\u0107 prostot\u0105 tre\u015bci,doskona\u0142\u0105 charakterystyk\u0105 psychologiczn\u0105 bohater\u00f3w,wspania\u0142ym obrazem pracy s\u0142u\u017cby domowej angielskiej arystokracji i po\u015brednio te\u017c i tej arystokracji. Ogl\u0105da\u0142am oczywi\u015bcie dawno temu film na podstawie tej ksi\u0105\u017cki,by\u0142 bardzo dobry, ale jednak nie do ko\u0144ca oddawa\u0142 mentalno\u015b\u0107,stan umys\u0142u i ducha bohatera. Genialnej ksi\u0105\u017cki nie przebije \u017caden, nawet najgenialniej nakr\u0119cony na jej podstawie film. Wracaj\u0105c do ksi\u0105\u017cki, to trudno by chyba znale\u017a\u0107 w literaturze drugiego takiego bohatera,kt\u00f3ry by tak irytowa\u0142,a jednocze\u015bnie wzbudza\u0142 podziw i wsp\u00f3\u0142czucie,sympati\u0119 i odruch niech\u0119ci, jak ten ch\u0142odny,beznami\u0119tny,opanowany i oficjalny do szpiku ko\u015bci angielski kamerdyner Stevens. To na co ja kierowa\u0142am moje my\u015bli czytaj\u0105c t\u0119 ksi\u0105\u017ck\u0119 to w\u0142a\u015bciwie nic takiego, czego bym wcze\u015bniej nie wiedzia\u0142a z autopsji,a mianowicie,\u017ce w \u017cyciu nie mo\u017cna ca\u0142kowicie i bezkrytycznie s\u0142u\u017cy\u0107 jednemu panu-jedynemu autorytetowi,bo mo\u017cna si\u0119 srodze zawie\u015b\u0107 i przegra\u0107 \u017cycie. Takie \u015blepe po\u015bwiecenie si\u0119 jednemu autorytetowi to nic innego jak fanatyzm w czystej postaci. A tzw. lojalno\u015b\u0107 nie mo\u017ce ogranicza\u0107 cz\u0142owieka w samodzielnym my\u015bleniu i posiadaniu w\u0142asnego zdania. Jest to ksi\u0105\u017cka m\u0105dra i wielowymiarowa i ka\u017cdy, kto oczywi\u015bcie lubi ksi\u0105\u017cki pobudzaj\u0105ce do my\u015blenia a nie takie z gatunku \u201ezabili go i uciek\u0142\u201d, mo\u017ce w niej wyczyta\u0107 co\u015b co go poruszy,bo to genialna w swej prostocie i wymowie ksi\u0105\u017cka.","reviewRating":{"@type":"Rating","ratingValue":"10","bestRating":"10","worstRating":"1"}},{"@type":"Review","datePublished":"2016-03-06 22:53:22.507485","url":"https:\/\/lubimyczytac.pl\/ksiazka\/5249583\/okruchy-dnia#opinie","author":{"@type":"Person","name":"Aurora92","url":"https:\/\/lubimyczytac.pl\/profil\/363530\/aurora92"},"reviewBody":"Powie\u015b\u0107 na wskro\u015b angielska - naprawd\u0119 bardzo trudno uwierzy\u0107, \u017ce napisa\u0142 j\u0105 Japo\u0144czyk!\n\nG\u0142\u00f3wnym bohaterem &quot;Okruch\u00f3w dnia&quot; jest kamerdyner Stevens, kt\u00f3rego \u017cyciowym celem sta\u0142o si\u0119 s\u0142u\u017cenie swojemu chlebodawcy. Na powie\u015b\u0107 sk\u0142adaj\u0105 si\u0119 wspomnienia Stevensa, 'okruchy dnia', kt\u00f3re rozpami\u0119tuje on podczas podr\u00f3\u017cy, a tak\u017ce kilka wydarze\u0144 z samej podr\u00f3\u017cy.\n\nMimo \u017ce powie\u015b\u0107 rewelacyjnie przedstawia prac\u0119 brytyjskiego kamerdynera, wszelkie zwi\u0105zane z ni\u0105 trudno\u015bci oraz logistyk\u0119, za jak\u0105 trzeba wszystko planowa\u0107 tak, aby si\u0119 nie posypa\u0142o, przez ca\u0142y czas zastanawia\u0142o mnie, gdzie czas na jakiekolwiek \u017cycie osobiste?\n\nStevens stara si\u0119 godnie s\u0142u\u017cy\u0107 swojemu pracodawcy, nie kwestionowa\u0107 jego opinii i pogl\u0105d\u00f3w. Razi\u0142a mnie te\u017c jego nadzwyczajna pow\u015bci\u0105gliwo\u015b\u0107 uczu\u0107, miejscami przechodz\u0105ca (moim zdaniem) wr\u0119cz w ch\u0142\u00f3d i oboj\u0119tno\u015b\u0107 - wzgl\u0119dem panny Kenton czy \u015bmierci w\u0142asnego ojca. Bo przecie\u017c powodzenie spraw wa\u017cnych dla los\u00f3w \u015bwiata i nienaganna pos\u0142uga s\u0105 wa\u017cniejsze. Niestety wiele lat p\u00f3\u017aniej przychodzi refleksja, \u017ce wcale si\u0119 nie \u017cy\u0142o w\u0142asnym \u017cyciem, a nawet nie mia\u0142o w\u0142asnych pogl\u0105d\u00f3w...","reviewRating":{"@type":"Rating","ratingValue":"7","bestRating":"10","worstRating":"1"}},{"@type":"Review","datePublished":"2018-02-05 21:49:06.768548","url":"https:\/\/lubimyczytac.pl\/ksiazka\/5249583\/okruchy-dnia#opinie","author":{"@type":"Person","name":"Nobel Hunter","url":"https:\/\/lubimyczytac.pl\/profil\/1815091\/nobel-hunter"},"reviewBody":"Kazuo Ishiguro z niezwyk\u0142\u0105 swobod\u0105 i pewno\u015bci\u0105 operuje stylem.\n\nNie umniejszaj\u0105c wagi t\u0142umaczenia, mamy do czynienia z pisarstwem najwy\u017cszego lotu. \n\nSubtelna prezentacja ani na chwil\u0119 nie dostaje zadyszki i p\u0142ynnie prowadzi do fina\u0142u, kt\u00f3ry pozostawia nas w zadumie nad losem g\u0142\u00f3wnych bohater\u00f3w.\n\nPS\nAdaptacja filmowa autorstwa Jamesa Ivory, ze znakomitymi kreacjami aktorskimi Anthony\u2019ego Hopkinsa i Emmy Thompson, jest niezwykle udana. Trzeba zobaczy\u0107. (8\/10)","reviewRating":{"@type":"Rating","ratingValue":"8","bestRating":"10","worstRating":"1"}},{"@type":"Review","datePublished":"2021-04-14 14:05:32.239419","url":"https:\/\/lubimyczytac.pl\/ksiazka\/5249583\/okruchy-dnia#opinie","author":{"@type":"Person","name":"Mylengrave","url":"https:\/\/lubimyczytac.pl\/profil\/97246\/mylengrave"},"reviewBody":"Bardzo mnie ta ksi\u0105\u017cka zm\u0119czy\u0142a. Poleci\u0142 mi j\u0105 tata, a jednak jego gust literacki nie pokrywa si\u0119 z moim, on lubi ksi\u0105\u017cki niespieszne, filozoficzne, pogr\u0105\u017cone w zadumie i zwyczajnym \u017cyciu, a ja zdaje si\u0119, wr\u0119cz odwrotnie.\nTo jest po prostu historia prostego m\u0119\u017cczyzny, kt\u00f3ry jest nudny i nie ma niczego ciekawego do zaoferowania, nie jest w stanie zrobi\u0107 na czytelniku wra\u017cenia, bo jest do b\u00f3lu zwyczajny, ba, on wygrywa w konkursie na zwyczajno\u015b\u0107 i bycie nijakim. Ksi\u0105\u017cka to opowie\u015b\u0107 snuta ospale, ze szczeg\u00f3lnym uwzgl\u0119dnieniem pierd\u00f3\u0142, czyli tego kto gdzie siedzia\u0142, w jaki spos\u00f3b \u017cartowa\u0142, to tak jakby z \u017cycia zebra\u0107 tylko to co nieistotne i napisa\u0107 o tym ksi\u0105\u017ck\u0119. Nawet w\u0105tek romantyczny jest taki, \u017ce go w zasadzie nie ma! Wszystko tu jest, a tego nie ma. Ja rozumiem, \u017ce taki mia\u0142 by\u0107 zamys\u0142. Rozumiem, \u017ce s\u0105 ciekawe aspekty ukazane, mi\u0119dzy innymi antysemityzmu czy w og\u00f3le stosunek cz\u0142owieka do drugiego cz\u0142owieka, oddanie pracy, kwestia priorytet\u00f3w \u017cyciowych, pewnego przelecenia \u017cycia przez palce. \nNie odbieram ksi\u0105\u017cce walor\u00f3w literackich, to nie jest z\u0142a powie\u015b\u0107, to jest prostu tempo \u017c\u00f3\u0142wia i tematyka dnia codziennego. Tytu\u0142 bardzo dobrze dobrany. Mnie zanudzi\u0142a, z ka\u017cdym kolejnym zdaniem chcia\u0142am, \u017ceby si\u0119 ju\u017c sko\u0144czy\u0142a. Zdania powtarzane, w k\u00f3\u0142ko to samo, ile mo\u017cna dywagowa\u0107 na jeden temat? Nie polecam poszukiwaczom wra\u017ce\u0144, tutaj s\u0105 anty-wra\u017cenia.\n\nWyzwanie czytelnicze LC kwiecie\u0144 2021: Przeczytam ksi\u0105\u017ck\u0119 z ok\u0142adk\u0105 w moim ulubionym kolorze: czarny (13).","reviewRating":{"@type":"Rating","ratingValue":"4","bestRating":"10","worstRating":"1"}},{"@type":"Review","datePublished":"2020-08-14 20:20:31.043519","url":"https:\/\/lubimyczytac.pl\/ksiazka\/5249583\/okruchy-dnia#opinie","author":{"@type":"Person","name":"Aleksandra","url":"https:\/\/lubimyczytac.pl\/profil\/668627\/aleksandra"},"reviewBody":"\u201eC\u00f3\u017c bowiem mo\u017cna osi\u0105gn\u0105\u0107 ci\u0105g\u0142ym grzebaniem si\u0119 w przesz\u0142o\u015bci i oskar\u017caniem siebie samego o to, \u017ce w \u017cyciu nie powiod\u0142o si\u0119 ca\u0142kiem tak, jak mo\u017cna by sobie tego \u017cyczy\u0107?\u201d\n\n\u201eOkruchy dnia\u201d to moja pierwsza powie\u015b\u0107 laureata literackiej Nagrody Nobla z 2017r. Kazuo Ishiguro. \n\nKilkudniowa podr\u00f3\u017c po Anglii staje si\u0119 dla Stevensa \u2013 kamerdynera od zawsze w pe\u0142ni po\u015bwi\u0119conego swojej pracy, okazj\u0105 do rozmy\u015bla\u0144 o przesz\u0142o\u015bci.\n\nAutor od pierwszych stron uj\u0105\u0142 mnie stylem. Lekkim, przemy\u015blanym stylem, kt\u00f3ry sprawia, \u017ce przez powie\u015b\u0107 si\u0119 dos\u0142ownie przep\u0142ywa. Niesamowite jest to w jak precyzyjny spos\u00f3b Ishiguro przedstawi\u0142 realia \u017cycia angielskiego kamerdynera w okresie mi\u0119dzywojennym. Stevens jest postaci\u0105 dopracowan\u0105 w ka\u017cdy calu, mo\u017cna poczu\u0107, \u017ce autor \u201ewszed\u0142 w jego sk\u00f3r\u0119\u201d pisz\u0105c powie\u015b\u0107, tym bardziej, \u017ce utrzymana jest ona w narracji pierwszoosobowej. Przedstawione realia \u017cycia s\u0142u\u017cby w XX-wiecznej Anglii, w tym przypadku kamerdynera, przywodzi\u0142y mi na my\u015bl hiszpa\u0144ski serial Gran Hotel, w kt\u00f3rym r\u00f3wnie\u017c precyzyjnie odmalowano w\u0105tek \u017cycia s\u0142u\u017cby. \n\nIshiguro poprzez swoj\u0105 leniwie snuj\u0105c\u0105 si\u0119 opowie\u015b\u0107 ukazuje, \u017ce \u017cycie cz\u0142owieka sk\u0142ada si\u0119 z niewykorzystanych okazji i straconych szans. Pe\u0142ne, wr\u0119cz chorobliwe oddanie pracy Stevensa, czyli obecny pracoholizm, skutkuje samotno\u015bci\u0105 i brakiem celu, gdy okazuje si\u0119, \u017ce nadchodz\u0105ca staro\u015b\u0107 nie pozwala wykonywa\u0107 swoich obowi\u0105zk\u00f3w w w pe\u0142ni precyzyjny spos\u00f3b, a coraz cz\u0119stsze drobne uchybienia skutkuj\u0105 irytacj\u0105 i smutkiem. \u017bycie przesz\u0142o\u015bci\u0105 dla wielu staje si\u0119 codzienno\u015bci\u0105, a patrzenie w pustk\u0119 przysz\u0142o\u015bci przynosi smutek\u2026 \n\nGenialna nie\u015bpieszna powie\u015b\u0107 stoj\u0105ca stylem i refleksjami, kt\u00f3re przychodz\u0105 po lekturze.\n\nZdecydowanie warto po ni\u0105 si\u0119gn\u0105\u0107, jednak trzeba mie\u0107 \u015bwiadomo\u015b\u0107, \u017ce, jako leniwie si\u0119 snuj\u0105ca opowie\u015b\u0107 bez \u017cadnej konkretnej akcji, nie ka\u017cdemu przypadnie do gustu.","reviewRating":{"@type":"Rating","ratingValue":"8","bestRating":"10","worstRating":"1"}},{"@type":"Review","datePublished":"2023-10-01 21:21:43.293323","url":"https:\/\/lubimyczytac.pl\/ksiazka\/5249583\/okruchy-dnia#opinie","author":{"@type":"Person","name":"Edi_Edi","url":"https:\/\/lubimyczytac.pl\/profil\/40424\/edi-edi"},"reviewBody":"#wyzwanieabecadlozpiecaspadlo\nJu\u017c wiem, \u017ce Kazuo Ishiguro ma specyficzna narracj\u0119. Powoln\u0105, troch\u0119 naoko\u0142o, wydawa\u0142oby si\u0119 \u017ce nudn\u0105, ale im bli\u017cej ko\u0144ca tym bardziej zapadaj\u0105 jego ksi\u0105\u017cki w dusz\u0119 i umys\u0142 i serce.\nI tak te\u017c by\u0142o z &quot;Okruchami dnia&quot;. S\u0142ucha\u0142am ich w genialnym wykonaniu Krzysztofa Goszty\u0142y i to by\u0142 majstersztyk. Beznami\u0119tny zasadniczy, profesjonalny, po angielsku sztywny kamerdyner snuje retrospekcje. Analizuje swoje \u017cycie, swoj\u0105 s\u0142u\u017cb\u0119 niby beznami\u0119tnie, ale z tej beznami\u0119tno\u015bci mo\u017ce wyczyta\u0107 po angielsku skrywane emocje. I to rozliczenie si\u0119 z \u017cyciem... Pi\u0119kna ksi\u0105\u017cka i w pe\u0142ni zas\u0142u\u017cona nagroda.","reviewRating":{"@type":"Rating","ratingValue":"7","bestRating":"10","worstRating":"1"}},{"@type":"Review","datePublished":"2016-10-10 08:48:33.820607","url":"https:\/\/lubimyczytac.pl\/ksiazka\/5249583\/okruchy-dnia#opinie","author":{"@type":"Person","name":"Hana","url":"https:\/\/lubimyczytac.pl\/profil\/360450\/hana"},"reviewBody":"Kamerdyner idealny,prawdziwy,godny,dystyngowany,do\u015bwiadczony,pracuj\u0105cy w Prawdziwym domu,Darington Hall,trafia do nowego pracodawcy \u2013 bogatego Amerykanina.Zgroza.On, Wielki Kamerdyner,oaza spokoju i kompetencji, uciele\u015bnienie dyskrecji,stawia czo\u0142o Amerykaninowi.T\u0142umaczy sobie zachowanie chlebodawcy,jest lojalny,ale Amerykanin jest niemo\u017cliwy i Kamerdyner cz\u0119sto zamiera w bezruchu skonsternowany.Stevens jest jednocze\u015bnie jakby upo\u015bledzony spo\u0142ecznie,uczy si\u0119 z radia \u017cartowa\u0107.Jego rozmowy z lud\u017ami s\u0105 napuszone i sztywne.Ten tydzie\u0144 urlopu,co go dosta\u0142, przeznacza na wspominanie czas\u00f3w \u015bwietno\u015bci Domu a jednocze\u015bnie zapiera si\u0119 swojego dawnego chlebodawcy,u kt\u00f3rego s\u0142u\u017cy\u0142 35 lat,a kt\u00f3rego opinia publiczna linczuje za wsp\u00f3\u0142prac\u0119 z Niemcami i antysemityzm.Wstydzi si\u0119?Stevens czytuje romanse ucz\u0105c si\u0119 z nich poprawnej angielszczyzny,ale podejrzewam,\u017ce wype\u0142niaj\u0105 one luk\u0119 w jego bezbarwnym i nudnym \u017cyciu.Stevens ustawia mur mi\u0119dzy sob\u0105 a swoim skrz\u0119tnie zepchni\u0119tym na dno uczuciem do gospodyni ,panny Kenton.Biedny Stevens.Czy kto\u015b doceni\u0142 jego fachowo\u015b\u0107,po\u015bwi\u0119cenie i godno\u015b\u0107?A \u017cycie up\u0142yn\u0119\u0142o niemal do ko\u0144ca i szansa na szcz\u0119\u015bcie zosta\u0142a pogrzebana.Czytamy ku przestrodze,by nie zaprzepa\u015bci\u0107 \u017cycia po\u015bwi\u0119caj\u0105c si\u0119 ca\u0142kowicie pracy.Gdzie\u015b tam czekaj\u0105 na nas LUDZIE.","reviewRating":{"@type":"Rating","ratingValue":"7","bestRating":"10","worstRating":"1"}},{"@type":"Review","datePublished":"2017-04-03 09:08:27.838828","url":"https:\/\/lubimyczytac.pl\/ksiazka\/5249583\/okruchy-dnia#opinie","author":{"@type":"Person","name":"Meowth","url":"https:\/\/lubimyczytac.pl\/profil\/608742\/meowth"},"reviewBody":"Powie\u015b\u0107, podobnie jak film ze wspania\u0142ymi rolami Anthony'ego Hopkinsa i Emmy Thompson, pozostawia po sobie uczucie ogromnego smutku, \u017calu, straty. \n\nButler, angielski kamerdyner najwy\u017cszej klasy, zarazem nadzoruj\u0105cy prac\u0119 reszty s\u0142u\u017cby, to osoba, kt\u00f3rej \u017cycie i ka\u017cda my\u015bl podporz\u0105dkowana jest s\u0142u\u017cbie swemu panu i temu, by swe obowi\u0105zki wykonywa\u0107 w spos\u00f3b nienaganny. Ka\u017cde \u017cyczenie, ka\u017cda zachcianka pana czy kt\u00f3rego\u015b z jego go\u015bci to sprawa niebywale wa\u017cna, w obliczu kt\u00f3rej nigdy nie ma czasu na \u017cadne prywatne uczucia, prze\u017cycia, k\u0142opoty. Lojalno\u015b\u0107 i pos\u0142usze\u0144stwo wobec pracodawcy posuni\u0119te s\u0105 tak daleko, \u017ce butler bez mrugni\u0119cia okiem znosi sytuacje, w kt\u00f3rych &quot;wielcy pa\u0144stwo&quot; urz\u0105dzaj\u0105 sobie zabaw\u0119 kosztem s\u0142u\u017c\u0105cego lub zlecaj\u0105 mu niedorzeczne i obra\u017aliwe zadania. Wierny kamerdyner broni nawet nazistowskich pogl\u0105d\u00f3w i sympatii chlebodawcy, a szowinistycznej decyzji personalnej swego pana (zwolnienie ze s\u0142u\u017cby dw\u00f3ch pokoj\u00f3wek pochodzenia \u017cydowskiego) nie skrytykuje nawet w g\u0142\u0119bi swego sumienia.\n\nI nic w tym dziwnego, poniewa\u017c bohater to osoba pozbawiona sumienia, duszy, serca. Swym zawodowym obowi\u0105zkom podporz\u0105dkowa\u0142 si\u0119 tak bardzo, \u017ce nie istnieje Stevens-cz\u0142owiek, pozosta\u0142 jedynie Stevens-s\u0142uga. Kontrapunktem dla tej odcz\u0142owieczonej postaci jest panna Kenton, osoba wra\u017cliwa, pe\u0142na emocji, empatii i poczucia sprawiedliwo\u015bci oraz przyzwoito\u015bci, cho\u0107 przecie\u017c te\u017c bez zarzutu wype\u0142niaj\u0105ca swe obowi\u0105zki gospodyni w ogromnej posiad\u0142o\u015bci. To w\u0142a\u015bnie wspomnienia o niej, o wsp\u00f3lnej pracy, utarczkach i nieporozumieniach oraz spotkanie z ni\u0105 po latach, pozwalaj\u0105 Stevensowi ujrze\u0107 samego siebie w innym \u015bwietle i zrozumie\u0107, \u017ce zupe\u0142nie zaprzepa\u015bci\u0142 swoje \u017cycie, wyrugowa\u0142 ze swego istnienia ca\u0142\u0105 prywatno\u015b\u0107 i szans\u0119 na jakiekolwiek osobiste szcz\u0119\u015bcie czy cho\u0107by rado\u015b\u0107. \n\nPrzyznam, \u017ce wol\u0119 jednak od ksi\u0105\u017cki film. Literacki Stevens to butler do szpiku ko\u015bci, nawet fina\u0142owa iluminacja nie zmieni w nim skutk\u00f3w wieloletniej &quot;tresury&quot; i tylko chwilami da si\u0119 w nim zaobserwowa\u0107 jakie\u015b, tak ludzkie przecie\u017c, w\u0105tpliwo\u015bci czy wahania. Wydaje si\u0119, \u017ce ca\u0142kiem skamienia\u0142. Tymczasem w filmie Jamesa Ivory'ego to posta\u0107 mniej stalowa, a przez to budzi wsp\u00f3\u0142czucie. Anthony Hopkins nada\u0142 mu wi\u0119cej cz\u0142owiecze\u0144stwa, w niekt\u00f3rych momentach wida\u0107 na ekranie wyra\u017anie, jak nadp\u0119ka skorupa zawodowej dyscypliny, w\u0105skimi szczelinami zaczynaj\u0105 s\u0105czy\u0107 si\u0119 prywatne emocje, ale Stevens w ostatniej chwili t\u0142umi je, pow\u015bci\u0105gaj\u0105c odruchy, i na powr\u00f3t przywdziewa mask\u0119 pierwszorz\u0119dnego, opanowanego s\u0142u\u017c\u0105cego. Doprawdy, wielka, wielka rola.","reviewRating":{"@type":"Rating","ratingValue":"8","bestRating":"10","worstRating":"1"}},{"@type":"Review","datePublished":"2017-10-20 20:45:51.792859","url":"https:\/\/lubimyczytac.pl\/ksiazka\/5249583\/okruchy-dnia#opinie","author":{"@type":"Person","name":"Mariolka","url":"https:\/\/lubimyczytac.pl\/profil\/590061\/mariolka"},"reviewBody":"Jak dla mnie, to si\u0119 troch\u0119 zbyt d\u0142ugo rozkr\u0119ca. Cho\u0107 to kr\u00f3tka ksi\u0105\u017ceczka, zaledwie 200 stron, swoj\u0105 powolno\u015bci\u0105 chyba, czy g\u0119sto\u015bci\u0105, rozci\u0105gn\u0119\u0142a mi si\u0119 na kilka wieczor\u00f3w. Intryguj\u0105ca jest w niej ta niedost\u0119pno\u015b\u0107, kt\u00f3r\u0105 poci\u0105ga za sob\u0105 profesjonalizm. Przez ca\u0142y czas ze\u015blizgujemy si\u0119 jak po szybie, kt\u00f3ra zdaje si\u0119 oddziela\u0107 nas od bohatera. Niezwyk\u0142e to jest, bo m\u0119czy, nudzi i z\u0142o\u015bci, a jednak nie odpycha od dalszej lektury. Tu punkt dla autora za kunszt. Niemniej jednak, nie jest to dla mnie ksi\u0105\u017cka zniewalaj\u0105ca. Ale dobra, ca\u0142kiem niez\u0142a. I tu si\u0119 powt\u00f3rz\u0119: ale \u017ceby Nobla?","reviewRating":{"@type":"Rating","ratingValue":"7","bestRating":"10","worstRating":"1"}}]}</script></body></html>
